# Runs the repository's own audit — the eight checkers over the claim registry,
# cross-references, caveats, scope propagation, notes conventions, and the seed index.
# No path filter: the registry and docs change outside ul-forge/, and the whole point
# is that the audit runs when nobody remembers to run it (FAILURES.md F-032).
#
# WARNING (F-036, 2026-10-14): no run of this workflow has ever produced a log. 31 runs
# across all four workflows fail in 2-5 seconds with log download 404, on ubuntu and macos
# alike, while the same commands pass locally. The jobs are not executing, and the cause is
# in repository/account settings rather than in this file. Until a run produces a log, a
# green or red badge here means nothing. Do not 'fix' this by editing the YAML - F-032 was
# already misdiagnosed as a path-filter problem once, and this workflow IS that fix.
name: Repository Checks

on:
  push:
  pull_request:

jobs:
  audit:
    name: tools/check.rb --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all checkers
        run: ruby tools/check.rb --strict
