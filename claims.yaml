# claims.yaml — the claim registry
#
# Every substantive claim in this repository has an entry here, with a tier and evidence.
# Documentation states claims; this file is what makes them checkable.
#
# TIERS (see GLOSSARY.md):
#   VERIFIED      machine-checked      -> requires `evidence:` resolving to a real test/proof artifact
#   ARGUED        written proof        -> requires `evidence:` linking a proof document
#   CONJECTURED   believed, unproven   -> requires `falsified_by:`
#   DESIGN-CHOICE a decision           -> requires `rationale:` and `alternatives_considered:`
#   RETIRED       withdrawn            -> requires `superseded_by:`, `formalization:`,
#                                         `revival_condition:`, `refutation_tier:`
#
# NEGATIVE-RESULT DISCIPLINE (normative; see research/method/negative-results.md):
#   R1  Every negative finding requires at least one ADVERSARIAL SEARCH against it before it is
#       recorded ("criticisms of X", "scope of X", "X superseded", "alternatives to X"). Always,
#       not when it seems warranted — that judgment is the compromised one.
#   R2  A negative result may not be CITED without its `scope:` conditions, and citing it requires
#       showing the target falls inside them. No scope, not citable.
#   R3  Retire FORMALIZATIONS, not claims. `formalization:` names what actually failed. A claim is
#       retired only when every known formalization fails, and that must be stated.
#   R4  Every retirement records a `revival_condition:` — what would have to be true for this to
#       come back — written at kill time, not discovered later.
#   R5  Refutations are tiered like claims via `refutation_tier:`. A finding that kills project
#       work meets the same evidentiary bar as one that advances it.
#   R6  State the steelman before the kill: what would have to be true for the positive to survive.
#
#   Origin: FAILURES.md F-017. Seven instances of using a finding to close a line of work that was
#   not closed, including two after the pattern had already been corrected twice mid-session.
#
# INTENDED CI CHECKS (not yet implemented; enforcement plan not yet written):
#   - VERIFIED entries must have an `evidence` path that exists and a test that passes
#   - ARGUED entries must have an `evidence` path that exists
#   - CONJECTURED entries must have `falsified_by`
#   - DESIGN-CHOICE entries must have `rationale` and `alternatives_considered`
#   - RETIRED entries must have `superseded_by`, `formalization`, `revival_condition`,
#     `refutation_tier`  (R3, R4, R5)
#   - Any entry carrying a `scope` must have it non-empty; negatives without `scope` are not
#     citable elsewhere in the repo (R2)
#   - No document in the working tree may cite a RETIRED claim id as current
#
# Seeded 2026-08-01. Honestly tiered — note how few are VERIFIED. That is the accurate picture.

