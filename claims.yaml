# claims.yaml — the claim registry
#
# Every substantive claim in this repository has an entry here, with a tier and evidence.
# Documentation states claims; this file is what makes them checkable.
#
# TIERS (see GLOSSARY.md):
#   VERIFIED      machine-checked      -> requires `evidence:` resolving to a real test/proof artifact
#   ARGUED        written proof        -> requires `evidence:` linking a proof document
#   CONJECTURED   believed, unproven   -> requires `falsified_by:`
#   DESIGN-CHOICE a decision           -> requires `rationale:` and `alternatives_considered:`
#   RETIRED       withdrawn            -> requires `superseded_by:`
#
# INTENDED CI CHECKS (not yet implemented; enforcement plan not yet written):
#   - VERIFIED entries must have an `evidence` path that exists and a test that passes
#   - ARGUED entries must have an `evidence` path that exists
#   - CONJECTURED entries must have `falsified_by`
#   - DESIGN-CHOICE entries must have `rationale` and `alternatives_considered`
#   - RETIRED entries must have `superseded_by`
#   - No document outside archive/ may cite a RETIRED claim id as current
#
# Seeded 2026-08-01. Honestly tiered — note how few are VERIFIED. That is the accurate picture.

version: 1
last_updated: "2026-08-01"

claims:

  # ─── Notation: design decisions, not discoveries ───────────────────────────

  - id: UWS-PRIMITIVE-COUNT
    statement: "The UWS alphabet consists of a small fixed set of iconic mark-features."
    tier: DESIGN-CHOICE
    rationale: research/uws-as-methodology-2026-08.md
    alternatives_considered: [5, 6]
    notes: >
      Repo currently ships 5 (Point, Line, Angle, Curve, Enclosure); the wiki uses 6 (adds Wave)
      with a genuine generative structure the 5 lacks: three binary axes, 6 = C(4,2) via tetrahedral
      rectification, and a clean Linear/Curved split. Decision pending. The tiebreaker is empirical,
      not aesthetic — see UWS-PERCEPTUAL-GROUNDING.
    status: OPEN-DECISION

  - id: UWS-SORT-COUNT
    statement: "The notation's type system uses four sorts: Entity, Relation, Modifier, Assertion."
    tier: DESIGN-CHOICE
    rationale: research/emergence-investigation/phase3-formal-necessity-rebuild.md
    alternatives_considered: [2, 3, 4, 6]
    notes: >
      A 3-sort flattening was demonstrated expressively equivalent at the cost of relocating
      disambiguating information into explicit tags. Standard model theory (Montague) needs only
      2 base types. Four is a drawability-motivated flattening.

  - id: UWS-OPERATION-SET
    statement: "The notation provides 13 composition operations."
    tier: DESIGN-CHOICE
    rationale: uws/formal-specification.md
    alternatives_considered: ["10 (pre-2026-04)", "13 (current)"]
    notes: "Complete and natural generating set, NOT minimal — see FAILURES.md F-002."

  # ─── Notation: laws that are asserted but unverified ───────────────────────

  - id: NEG-INVOLUTION
    statement: "negate(negate(a)) is semantically equivalent to a."
    tier: CONJECTURED
    falsified_by: "A pair (a, negate(negate(a))) that semantically_equal reports as unequal."
    evidence: null
    notes: >
      Documentation asserted this as proven. The implementation wraps in a new enclosure node, so
      it is structurally FALSE, and no equivalence procedure exists to evaluate the semantic reading.
      See FAILURES.md F-006. Blocked on SEMANTIC-EQUALITY.
    blocks: [CURE-REPAIR-DETERMINISM, UQPL-REDUCTION]

  - id: SEMANTIC-EQUALITY
    statement: "There exists a decision procedure determining whether two GIR structures mean the same thing."
    tier: CONJECTURED
    falsified_by: "A proof that GIR semantic equivalence is undecidable in the general case."
    evidence: null
    notes: >
      DOES NOT EXIST IN ANY FORM, but is no longer novel research. Term rewriting + Knuth-Bendix
      completion is the standard solution shape: confluent terminating rewrite system -> decide
      equality by normal-form comparison. BLOCKED on IR-NORMALIZATION-STRATEGY: that machinery
      applies cleanly to terms, and confluence is undecidable for general graph rewriting.
      See research/prior-art-audit-2026-08.md.
    priority: 1
    blocked_by: [IR-NORMALIZATION-STRATEGY]

  # ─── Implementation: what is actually verified ─────────────────────────────

  - id: GIR-SCHEMA-VALIDATION
    statement: "The validator rejects malformed GIR: duplicate node IDs, dangling edge references, missing root, incompatible edge-endpoint sorts."
    tier: VERIFIED
    evidence: ul-forge/crates/ul-core/src/validator.rs
    notes: >
      Genuinely works and is well-structured. NOTE the terminology trap: these are GRAPH invariants,
      not SEMANTIC invariants. See GLOSSARY.md. The Cure's layer does not exist.

  - id: PARSER-ROUNDTRIP
    statement: "UL-Script parses to GIR and deparses back."
    tier: VERIFIED
    evidence: ul-forge/crates/ul-core/src/parser/
    notes: "Covered by the existing test suite (135 tests across the workspace)."

  # ─── The Cure ──────────────────────────────────────────────────────────────

  - id: CURE-REPAIR-DETERMINISM
    statement: "The repair operator returns a unique admissible state for any corrupted input."
    tier: RETIRED
    superseded_by: FAILURES.md#f-009
    notes: >
      Cannot hold as specified. Projection onto a non-convex admissible region is multivalued
      (Hilbert projection theorem requires convexity for uniqueness), and 𝒜 is almost certainly
      non-convex given non-contradiction. Needs redesign, not repair.

  - id: IR-NORMALIZATION-STRATEGY
    statement: "GIR's normalizing core is an acyclic term graph; coreference and self-reference are expressed as labels (CGIF-style *x/?x), not cyclic edges."
    tier: DESIGN-CHOICE
    rationale: research/ir-decision-2026-08.md
    alternatives_considered:
      - "cyclic general graph (rejected: confluence undecidable, Plump)"
      - "pure tree (rejected: loses sharing, which term graphs give for free)"
      - "DPO with interfaces (viable; equivalent effect, more invasive reframing)"
      - "abandon normalization (rejected: loses all algebraic law checking)"
    notes: >
      Decidability boundary is CYCLES, not graphs. Term graphs / DAGs retain the Critical Pair Lemma
      and a decision procedure for confluence given termination; general cyclic DPO does not. GIR is
      currently cyclic by deliberate design (self-reference), which is exactly what placed it in the
      undecidable regime. Three independent lines — term graph rewriting, DPO-with-interfaces
      ("interfaces play the same role as variables"), and CGIF coreference labels — converge on
      expressing cross-links as variables rather than edges. Nothing expressive is lost; coreference
      moves from the edge layer to the label layer.
    superseded_conjecture: "IR-NORMALIZATION-STRATEGY (CONJECTURED form, 2026-08-01) — see FAILURES.md F-011"

  - id: SEMANTIC-EQUALITY-IMPL
    statement: "semantically_equal is implemented as e-class equality under equality saturation (e-graphs)."
    tier: DESIGN-CHOICE
    rationale: research/ir-decision-2026-08.md
    alternatives_considered:
      - "Knuth-Bendix completion to normal forms (viable but requires orienting rules; may not complete)"
      - "e-graphs / equality saturation (preferred: no canonical normal form needed, degrades gracefully with timeout)"
    notes: >
      egg (POPL 2021) is a fast extensible equality-saturation library in Rust; ul-forge is Rust.
      Equality saturation applies rewrites non-destructively until saturation and checks whether two
      terms occupy the same e-class, so confluence becomes an optimization rather than a
      prerequisite. First milestone: encode the notation's laws as egg rewrites over the acyclic
      core and implement semantically_equal as e-class equality. Closes F-006, unblocks
      SEMANTIC-EQUALITY.

  - id: NEGATE-REIMPLEMENTATION
    statement: "negate is implemented as a sigma field (assertional sign) on the assertion, not a self-loop marker edge."
    tier: DESIGN-CHOICE
    rationale: research/ir-decision-2026-08.md
    alternatives_considered:
      - "self-loop references edge as marker (current implementation; introduces a cycle)"
      - "boundary inversion via sigma field (documented April 2026, never built)"
    notes: >
      The current self-loop implementation is the specific construct that makes involution
      unverifiable: negation is built from the cyclic feature that makes confluence undecidable.
      Reimplementing with sigma both removes a cycle from the core and finally makes the documented
      F-001 fix real. See FAILURES.md F-001, F-006, F-011.

  - id: UWS-FORMAL-TARGET
    statement: "UWS aims at soundness and completeness for a stated fragment, following the Shin template."
    tier: DESIGN-CHOICE
    rationale: research/ir-decision-2026-08.md
    alternatives_considered:
      - "no formal target (status quo)"
      - "full-FOL completeness immediately (rejected: Shin's Venn-II reaches only monadic predicate logic; UWS is relational, hence strictly harder)"
    notes: >
      Shin (1994) proved soundness and completeness for Venn-I and Venn-II by giving each a syntax
      (well-formed diagrams, permitted manipulations) and a semantics (logical consequence among
      diagrams). Venn-II is equivalent to monadic predicate logic. UWS targets polyadic relations,
      so completeness is harder — prove it for a stated fragment first and grow the fragment, which
      is how Euler -> Venn -> Peirce -> Shin actually progressed.

  - id: IR-NORMALIZATION-STRATEGY-OLD
    statement: "GIR admits a decidable notion of structural/semantic equivalence via normalization (unrestricted)."
    tier: RETIRED
    superseded_by: research/ir-decision-2026-08.md
    falsified_by: >
      Confirmed: FALSE for general graph rewriting. Confluence of terminating DPO graph rewriting
      is undecidable (Plump), and critical-pair joinability does not entail confluence as it does
      for terms. Holds only under a restricted strategy.
    evidence: research/prior-art-audit-2026-08.md
    notes: >
      BLOCKING DESIGN DECISION. Options: (a) restrict normalizing fragment to a term/tree structure
      (the existing graph-with-tree-spine architecture suggests this was half-intuited);
      (b) adopt DPO-with-Interfaces, where confluence IS decidable; (c) abandon normalization and
      decide equivalence another way. Nothing downstream should be built before this is chosen.
    priority: 0
    blocks: [SEMANTIC-EQUALITY, NEG-INVOLUTION, UQPL-REDUCTION]

  - id: CURE-CHECK-SHACL
    statement: "The shape-constraint half of the Cure's check phase is served by SHACL rather than built from scratch."
    tier: DESIGN-CHOICE
    rationale: research/research-cycle-2026-08-answers.md
    alternatives_considered: ["hand-rolled constraint checker", "SHACL (W3C standard, tooled)"]
    notes: >
      SHACL provides node/property shapes, cardinality, type, enumeration and pattern constraints,
      closed-world validation via sh:closed, and per-violation conformance reports. It is already
      used as a type system and its shape containment is decidable via DL reasoning. It CANNOT
      express non-contradiction or entailment conflict — that half needs a reasoner. The useful
      result is that the check phase cleanly splits: SHACL for shape, DL reasoner for consistency,
      and neither needs inventing.

  - id: CURE-SHEAF-ROUTE
    statement: "Semantic inconsistency is an obstruction to the existence of a global section, detectable via sheaf cohomology."
    tier: CONJECTURED
    falsified_by: "The IR admits no natural sheaf structure, or H^1 fails to distinguish genuine semantic inconsistency from benign local variation."
    evidence: research/research-cycle-2026-08-answers.md
    notes: >
      Abramsky-Brandenburger formalize contextuality as exactly "a discrepancy between local
      consistency and global inconsistency," with contextuality corresponding to obstructions to
      global sections and first Cech cohomology H^1 != 0 giving a rigorous, linear-algebraically
      computable obstruction. This is the closest structural match to the Cure's failure mode found
      so far, and the only candidate route that both DETECTS and LOCALIZES with a computable
      invariant. Third route alongside metric projection and ontology pinpointing; all three should
      be compared head to head.
    compare_with: [CURE-REPAIR-FORMULATION, CURE-REPAIR-CONVEX-ROUTE]

  - id: UWS-TAUGHT-NOTATION
    statement: "UWS is a taught notation; learnability and curriculum are core deliverables, not afterthoughts."
    tier: DESIGN-CHOICE
    rationale: research/research-cycle-2026-08-answers.md
    alternatives_considered: ["self-evident iconic notation (retired — see FAILURES.md F-012)"]
    notes: >
      ISO-standardized safety pictograms fail a 67% comprehension bar without training; Linear A is
      structurally rich and unread; music notation requires pre-memorized glyph-value associations.
      Iconicity does not bootstrap meaning. Being a taught notation is normal and respectable — it
      just makes comprehension testing against an ISO-style criterion a real deliverable.

  - id: UWS-COGNITIVE-DIMENSIONS
    statement: "UWS design decisions, including the primitive count, are evaluated against the Cognitive Dimensions of Notations framework."
    tier: DESIGN-CHOICE
    rationale: research/research-cycle-2026-08-answers.md
    alternatives_considered: ["aesthetic/ad hoc judgement (status quo)"]
    notes: >
      Green & Petre's framework supplies real criteria — viscosity, hidden dependencies, premature
      commitment, progressive evaluation, closeness of mapping — and its seminal case study analyzed
      visual dataflow languages (LabVIEW, Prograph), closely analogous to UWS. Notably "hidden
      dependencies" names exactly the coreference problem the IR decision introduced: a notation
      where ?x refers to a distant *x has hidden dependencies by construction and must make them
      visible.

  - id: CURE-REPAIR-CONVEX-ROUTE
    statement: "If each semantic invariant is designed to carve a convex constraint, the admissible region is convex by construction and metric projection yields a unique repair."
    tier: CONJECTURED
    falsified_by: "An invariant required by the Cure that provably cannot be expressed as a convex constraint without losing its intended force."
    evidence: research/unexplored-territory-2026-08.md
    notes: >
      Reopens a route closed too early. F-009 correctly showed that an ARBITRARY admissible region
      is non-convex, so projection is multivalued. But the INTERSECTION of convex sets is convex, so
      designing each invariant as a convex constraint makes the region convex by construction and
      restores the Hilbert projection theorem. Gardenfors' conceptual spaces gives this independent
      cognitive-science motivation: a natural concept is a convex region, and convexity is argued to
      be what makes concepts learnable and communicable.
      CAVEAT ADDED ON REVIEW: convexity is a property of a set RELATIVE TO a choice of quality
      dimensions and metric — given freedom over the embedding, a wide class of sets can be made
      convex. So this may inherit a Zadrozny-style vacuity unless the quality dimensions are
      justified independently, which is roughly as hard as the original problem. Gardenfors'
      criterion is also normative/definitional rather than an empirical finding. Still worth
      comparing; advantage is conditional.
      See research/source-critique-2026-08.md section 4.
    compare_with: [CURE-REPAIR-FORMULATION]

  - id: UWS-AMR-BENCHMARK
    statement: "The AMR corpus provides an expressiveness benchmark for UWS at scale."
    tier: CONJECTURED
    falsified_by: "AMR structures turn out to be systematically inexpressible in UWS for reasons that make the comparison uninformative rather than diagnostic."
    evidence: research/unexplored-territory-2026-08.md
    notes: >
      AMR 3.0 contains 59,255 human-annotated meaning graphs built for unrelated purposes. Useful as
      a STRESS TEST (does UWS break on structures someone else designed?). AMR also hit the same
      reentrancy/sharing problem and solved it with variables — a third independent confirmation of
      the IR decision.
      CRITICAL CAVEAT: the corpus is ENGLISH ONLY, built on PropBank (an English predicate-argument
      lexicon), annotated by English speakers. Any coverage figure measures ENGLISH expressibility.
      Reporting it as universality would reproduce UNL's single most documented failure mode
      (English bias in a "universal" vocabulary). Requires a non-English counterpart — cross-lingual
      and Chinese AMR efforts exist and should be checked before use.
      See research/source-critique-2026-08.md section 2.
    priority: 2

  - id: GROUNDING-PROBLEM
    statement: "A structurally regular notation is readable by a mind that shares no reference world with its author."
    tier: CONJECTURED
    falsified_by: >
      Already under severe pressure: Linear A is structurally rich and has resisted decipherment for
      70+ years. Linear B succeeded only because Ventris could conjecture the underlying language
      family and anchor on known place names.
    evidence: research/unexplored-territory-2026-08.md
    notes: >
      This is the project's FOUNDING PREMISE and its least defended claim. Decipherment is the
      empirical science of exactly this problem, and its record says structure without shared
      reference is insufficient. Changizi grounds the marks in human vision shaped by terrestrial
      scenes, which does not transfer to a differently-sensed mind. No account of what supplies
      grounding currently exists.
    priority: 1

  - id: CURE-REPAIR-FORMULATION
    statement: "Repair should be formulated discretely (pinpointing / minimal diagnoses) rather than as metric projection."
    tier: DESIGN-CHOICE
    rationale: research/prior-art-audit-2026-08.md
    alternatives_considered: ["metric projection onto admissible region (rejected: multivalued for non-convex 𝒜)", "AGM belief revision", "ontology-repair pinpointing"]
    notes: >
      The ontology debugging/repair field solves this problem discretely — minimal inconsistent
      subsets, justifications, minimal vs minimal-cardinality diagnoses, root unsatisfiable concepts
      — which sidesteps the convexity obstruction in F-009 entirely. AGM belief revision supplies
      the minimal-change postulates, already extended to description logics. Largest available
      scope reduction in the program.

  - id: IR-PRIOR-ART-POSITION
    statement: "GIR's relationship to Sowa's Conceptual Graphs / ISO 24707 Common Logic is stated explicitly before any new IR spec is written."
    tier: CONJECTURED
    falsified_by: "A new IR spec authored without addressing CGIF interoperability or stating the difference."
    evidence: research/prior-art-audit-2026-08.md
    notes: >
      Conceptual Graphs are a graph representation for logic with full FOL power, formal semantics
      under ISO/IEC 24707, and a standard interchange format (CGIF). This is direct prior art for
      the IR layer, standardized in 2007. UWS's differentiator is the iconic 2D visual layer, not
      the graph IR.

  - id: CURE-SCOPE
    statement: "The Cure enforces local structural validity under defined semantic invariants — it is not alignment, adversarial immunity, or ethical correctness."
    tier: DESIGN-CHOICE
    rationale: research/reassessment-2026-08-purpose-anchored.md
    alternatives_considered: ["broader alignment claim (rejected)"]
    notes: >
      Deliberately scoped down. Comprehension does not entail alignment (orthogonality thesis);
      a structurally valid system can optimize undesirable objectives.

  # ─── UQPL ──────────────────────────────────────────────────────────────────

  - id: UQPL-TOTALITY
    statement: "UQPL is a total language: every program terminates."
    tier: DESIGN-CHOICE
    rationale: research/reassessment-2026-08-purpose-anchored.md
    alternatives_considered: ["Turing-complete via fix (rejected for the Cure's repair loop)"]
    notes: >
      As specified (typed lambda calculus, beta-reduction, no fix/recursion) the language is
      strongly normalizing, hence provably NOT Turing-complete. Adopt this as a guarantee rather
      than a limitation: a repair loop that can diverge is unusable in a safety path. Precedent:
      Dhall, Gallina.

  - id: UQPL-QUANTUM-LAYER
    statement: "UQPL's superposition and entanglement operations are mathematically well-founded."
    tier: RETIRED
    superseded_by: research/deep-critique-2026-08-wiki-and-implementation.md
    notes: >
      The Semantic Hilbert Space has no concrete inner product, no basis, and no completeness or
      separability treatment; the Psi Condensation Threshold that would make the quantum reading
      physical has an underived formula and an uncalibrated critical value. Not a design target.
      If revived, start by specifying an RKHS kernel.

  # ─── Open research questions ───────────────────────────────────────────────

  - id: UL-EXISTS
    statement: "A mind-independent universal semantic structure exists."
    tier: CONJECTURED
    falsified_by: >
      No agreed falsifier — this is the open question, and part of the finding is that it may not
      be decidable as posed. See F-004.
    evidence: research/emergence-investigation/phase6-synthesis-and-verdict.md
    notes: "Not established, not refuted. Explicitly NOT a premise of any buildable work here."

  - id: UWS-PERCEPTUAL-GROUNDING
    statement: "UWS mark features are grounded in visual discriminability and natural-scene statistics, not in Platonic geometry."
    tier: ARGUED
    evidence: research/uws-as-methodology-2026-08.md
    notes: >
      Changizi et al. (2006, American Naturalist) analyzed 100+ writing systems and found shared
      contour-configuration signatures matching natural-scene junction statistics. This is the
      strongest convergence evidence available to the project. Upgrade to VERIFIED by running the
      confusion-matrix / legibility studies the wiki's "Content-Prime Test" promises.

  - id: UWS-AS-INSTRUMENT
    statement: "Expressive failures of the notation are empirical data about the structure of meaning."
    tier: DESIGN-CHOICE
    rationale: research/uws-as-methodology-2026-08.md
    alternatives_considered: ["UWS as pure output/rendering of UL (rejected — loses the discovery mechanism)"]
    notes: >
      Only valid under a hard rule: failures are logged in FAILURES.md and never patched into
      successes. The D2 history (32%->100% via nine patches) is what happens without that rule.
