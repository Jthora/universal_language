  # ─── Cross-substrate universals (added 2026-08, Chomsky/primitive-set pass) ─

  - id: UG-IS-CROSS-SUBSTRATE
    statement: >
      Chomskyan Universal Grammar describes a real phenomenon but misattributes its cause; the
      universals arise from constraints on any learner, making them cross-substrate rather than
      species-specific. Chomskyan UG is the special case where the learner is a human brain.
    tier: ARGUED
    evidence: research/framework/cross-substrate-grammar.md
    notes: >
      Two established steps plus one extension. Step 1 (Christiansen & Chater, BBS 2008): universals
      are "emergent properties of how the brain learns, rather than genetically encoded principles";
      UG could not have arisen by biological adaptation because language change outpaces genetic
      change. Step 2 (ours): the argument nowhere requires the learner to be human. Step 3
      (evidence): emergent-communication agents show convergent compositional structure with no
      human involvement. Supersedes the earlier recommendation to avoid the term — see F-014.

  - id: SURFACE-DIVERSITY-IS-PREDICTED
    statement: >
      Evans & Levinson's finding of vanishingly few surface universals across 6,000-8,000 languages
      is consistent with, and predicted by, emergent universality — invariants appear only under
      coarse-graining, never at the microscopic level.
    tier: CONJECTURED
    falsified_by: >
      Coarse-grain the WALS typological database under a defined projection and find no invariant
      structure. If surface diversity persists all the way up the coarse-graining hierarchy with
      nothing stable emerging, the universality-class reading of language typology dies.
    evidence: research/framework/cross-substrate-grammar.md
    notes: >
      Converts the strongest counter-evidence in linguistics into supporting context WITHOUT making
      it unfalsifiable — the coarse-graining test is the price of the reframe and must actually be
      run. Nobody appears to have attempted it.

  - id: PRIMITIVE-SETS-ARE-GENERATING-SETS
    statement: >
      Alternative primitive sets (4a, 4b, 5, 6, base-N) are generating sets for one structure, not
      competing bases; therefore their differing cardinalities are presentation artifacts and carry
      no information about the object.
    tier: ARGUED
    evidence: research/framework/cross-substrate-grammar.md
    notes: >
      Grounded in the collapse relations the sets themselves exhibit: a wave is a periodic curve,
      an angle is two lines meeting. Non-independence rules out the basis reading. Vector-space
      bases have invariant cardinality; generating sets do not. Corroborating external evidence:
      five independent traditions give five different counts (Montague 2, UWS 4-6, Vaisesika 6-7,
      Aristotle 10, Wierzbicka NSM 65), and NSM's own count moved 60 -> 65 over two decades.
      Non-convergence on count is the predicted signature of an irrelevant operator.

  - id: DEFINITIONAL-DEPENDENCY-ISOMORPHISM
    statement: >
      The dependency ordering of Euclid's geometric definitions is isomorphic to the dependency
      orderings of independently developed ontological category systems (Aristotle, Vaisesika).
    tier: RETIRED
    superseded_by: research/notes/015-dependency-order-test/README.md
    formalization: "Euclid's Elements Book I definitional sequence as the geometric side (R3)"
    scope: >
      What fails is THIS comparison. It does NOT show that geometry and ontology have unrelated
      structure, nor that cross-civilizational corroboration (S4) is unavailable in general.
    revival_condition: >
      Run the geometric side from a source whose definitions are REAL and load-bearing. THREE live
      options, per note 016: Hilbert's Grundlagen; Tarski's axioms; or — newly available and closest
      to the notation's actual practice — EUCLID'S POSTULATES read constructively, which are
      load-bearing where his definitions are not. Fine's essentialist criterion then supplies a principled
      bridge to ontological dependence. NOT cheap: requires real work on both sides.
    refutation_tier: "ARGUED — documented fact about the Elements plus a standard distinction in the dependence literature"
    notes: >
      THREE INDEPENDENT DEFECTS, any one sufficient.
      (1) "Euclid never refers to the first nine definitions, or to any other descriptive
      definitions, to justify steps in his proofs." Those nine — point, line, extremities, straight
      line, surface, plane surface — are exactly the ones this test needs. They are descriptive
      prefatory material and do no mathematical work, so their ordering is EXPOSITORY, not derived.
      (2) Definitional and ontological dependence are different relations. Fine's essentialist
      account bridges them only via REAL definitions ("states what the defined object is") as
      opposed to NOMINAL ones ("what a competent speaker understands"). Euclid's function as
      nominal.
      (3) Aristotle himself distinguishes definitional priority (Categories 12, Metaphysics 5.11)
      from ontological priority, so collapsing them misreads the source. Vaisesika differs again:
      samavaya (inherence) is itself a category, with no counterpart in either other system.
      AND even granting all three, the orders are not isomorphic: Euclid gives a CHAIN of depth >=4,
      Aristotle and Vaisesika give FANS of depth 2. Shared structure reduces to "has a unique
      minimal element," which is far too weak to carry anything.
      See FAILURES.md F-020 — promoted for a dozen turns without one adversarial search, because R1
      governed inherited claims and not my own proposals.

  - id: KAPPA-STRATIFICATION
    statement: >
      The UWS primitives are cells in a PRODUCT of three independent classifications — curvature
      (metric), singularity structure (differential), and closure (topological) — not strata of a
      single curvature space. Collapse relations are partition coarsenings; loss under a group is
      failure of invariance. These are distinct.
    tier: ARGUED
    evidence: research/notes/022-phase2-derivations/README.md
    notes: >
      DERIVED in note 022, having been asserted in prose since note 005. The derivation CORRECTED
      the framing: three of the six primitives are not regular C2 curves at all (Angle has a corner,
      Enclosure is a global closure condition, Point is 0-dimensional), so the space cannot be
      curvature functions alone. The classification is a product of three axes:
      AXIS 1 curvature (metric, local): Z (kappa=0), C (kappa=const!=0), P (non-constant periodic),
      V (non-constant aperiodic).
      AXIS 2 singularities (differential, local): S0 none, S+ finitely many corners.
      AXIS 3 closure (topological, global): O open, L closed.
      Cells: Line (Z,S0,O); Circle (C,S0,L); Wave (P,S0,O); Curve (V,S0,O); Angle (Z,S+,O);
      ENCLOSURE (.,.,L) — axis 3 ALONE, curvature unconstrained.
      THE RESULT, and it explains ERLANGEN-SURVIVAL-RANKING rather than merely agreeing with it:
      Enclosure is defined by axis 3 only and Point is not in the space at all, so the two survivors
      are exactly the primitives NOT defined by curvature conditions. Coarse-graining discards metric
      structure first, then differential, retaining topological — so the axes die in that order and
      survival is determined by which axis a primitive lives on.
      COLLAPSES AS THEOREMS: Wave/Curve differ only by periodicity within "kappa non-constant", so a
      partition that does not resolve periodicity merges them — they are siblings, not nested.
      Angle/Line differ ONLY on axis 2, so forgetting the singularity set merges them, which is
      exactly what topological coarse-graining does.
      MERGE vs DISSOLVE, formalized: merge is a fact about the partition; dissolve is failure of
      invariance under the group (kappa=const is not affine-invariant — an ellipse has non-constant
      Euclidean curvature).
      CURVATURE AXIS REPAIRED (note 033). Note 032 called it underdetermined, which was too
      pessimistic. The problem was the COORDINATES, not the axis: {Z,C,P,V} is a discretization
      imposed on a function space, and function spaces have no canonical finite partition. But plane
      curves carry canonical INTEGER invariants.
      WHITNEY-GRAUSTEIN: "regular closed curves in the 2-plane are classified, up to regular
      homotopy, by their ROTATION NUMBER" — two regular closed curves are regularly homotopic iff
      their rotation numbers are equal. A COMPLETE classification by a single integer.
      Also canonical: vertex count (curvature extrema), with the four-vertex theorem giving >= 4 for
      a simple closed curve; and inflection count.
      SO THE AXIS SHOULD BE INDEXED BY INTEGER INVARIANTS, NOT AD-HOC CLASSES. {Z,C,P,V} was a
      guess; rotation number is a theorem. Re-deriving the axis on these coordinates is outstanding.
      TWO AXES WERE UNDERDETERMINED (note 032, audit) — curvature now has a repair path; singularity
      does not yet. CURVATURE: P is a proper subset of V, since
      periodic kappa is a special case of non-constant kappa — so {Z,C,P,V} is a partition with one
      arbitrary refinement inside it. And kappa has unboundedly many properties (monotonic, bounded,
      sign-definite, analytic, of bounded variation) with nothing selecting these four. This entry
      derived that primitives ARE strata of kappa-space; it never derived WHICH strata.
      SINGULARITY: S+ lumps every singular case together and could refine by count of corners, order
      of discontinuity, or isolation. Binary is a choice, not a result.
      WHY THIS DOES NOT PROPAGATE: the two underdetermined axes are the METRIC and DIFFERENTIAL ones
      — exactly the axes that die under coarse-graining. Nothing at the fixed point depends on them.
      That is not luck: metric structure has no canonical stratification, which is the same reason
      coarse-graining discards it.
      LIMITS: no particular primitive set (4a, 4b, 5, 6) is derived as canonical, and none is
      claimed. Periodicity requires a domain long enough to exhibit a period; undefined for short
      arcs. Tier remains ARGUED — hand derivation; VERIFIED needs a proof assistant.
      Fundamental Theorem of Plane Curves: a smooth curvature function kappa(s) plus initial
      conditions determines a unique arc-length curve, and two unit-speed plane curves with equal
      curvature differ only by a Euclidean motion. A plane curve IS its curvature function up to
      rigid motion. Strata: kappa=0 line; kappa=const circle; kappa periodic wave; kappa variable
      general curve; kappa=0 a.e. with isolated singularities angle; closed (total turning 2*pi*n)
      enclosure. Derives the user-reported collapses: wave is a sub-stratum of variable curvature,
      and angle is piecewise-zero curvature with singular points. Does NOT prove the hand-chosen
      set was forced; it proves the question "which primitives" is well-posed as "which partition
      of curvature space" with an enumerable answer space. Upgrade to VERIFIED by formalizing the
      partition lattice in a proof assistant.

  - id: ERLANGEN-SURVIVAL-RANKING
    statement: >
      Under the Erlangen hierarchy the primitives are ranked by robustness, and only Point and
      Enclosure survive to the topological level; the entire curvature family is eliminated by the
      projective level.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    supersedes_tier_of: ERLANGEN-AS-COARSE-GRAINING
    notes: >
      DERIVED case by case in note 014, having previously been asserted in prose. Survival is
      defined there as closure (the defining property is G-invariant) plus distinguishability (not
      merged with another primitive), which separates two failure modes the prose conflated —
      MERGE (class survives, distinction lost) and DISSOLVE (defining property not G-invariant).
      FOUR CORRECTIONS the derivation forced against the asserted version:
      (1) "The curvature family dies by projective" was WRONG. Line is kappa=0, part of that family,
      and survives projective — collinearity IS the projective invariant. Line dies at TOPOLOGICAL.
      (2) Wave dies at AFFINE, not projective. Concrete counterexample: shear (x,y) -> (x, y+cx)
      sends y = sin x to y = sin x + cx, which is not periodic.
      (3) Circle merges in TWO stages: into conics at affine, then all conics unify at projective.
      (4) Angle survives PARTIALLY — the corner persists to projective while angle magnitude is lost
      at affine. A binary table could not express this.
      SUBTLETY the prose could not see: enclosure at the projective level holds on RP2 but can fail
      on R2, since a projective map may send part of a closed curve to infinity (a circle can map to
      a hyperbola, bounding no compact region). The anchor is unconditional only at the topological
      level, which strengthens the case for anchoring there.
      TIER HONESTY: remains ARGUED, not VERIFIED. What changed is not the tier but whether the tier
      was warranted — asserted before, derived now. VERIFIED would require a machine-checked
      artifact.

  - id: ENCLOSURE-IS-DISTINCTION
    scope_reviewed: [NEG-INVOLUTION]   # accounted for — the DNE conflict is why the Spencer-Brown calculus half was withdrawn
    statement: >
      Enclosure, the topologically-surviving primitive, is the same object as the Layer 0
      distinction (Spencer-Brown's mark), via Jordan separation.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    notes: >
      SPLIT IN NOTE 022. Two things had been bundled and only one survives.
      RETAINED — Jordan Curve Theorem: a simple closed curve separates the plane into exactly two
      connected components, one bounded and one unbounded, with the curve as their common boundary.
      This is the axis-3 condition of KAPPA-STRATIFICATION and it commits to no logic.
      WITHDRAWN — the identification with Spencer-Brown's primary algebra. "The primary algebra is
      essentially isomorphic with classical propositional calculus"; Spencer-Brown "ended up with an
      algebra that later writers showed to be the Boolean algebra of two elements." Its crossing
      axiom is INVOLUTIVE, which is the double-negation elimination that
      NOTATION-LOGIC-IS-INTUITIONISTIC rules out. Adopting the LoF calculus would make the notation
      classical — the same conflict as NEG-INVOLUTION, from a different direction.
      FURTHER CAVEAT weakening it in both directions: some scholars hold LoF is "not isomorphic to
      Boolean Algebra" given representational differences, with "a many-to-one map from Boolean
      Algebra to LoF". So it is not a clean isomorphism either way, which is an additional reason not
      to rest Layer 0 on it.
      LAYER 0 AS DISTINCTION SURVIVES; LAYER 0 AS SPENCER-BROWN'S CALCULUS DOES NOT. This is the first FORMAL link between the framework's philosophical
      floor and its geometric inventory — previously they sat adjacent with nothing connecting
      them. Consequence: if a semantic fixed point exists, what sits at it is distinction and
      incidence, not a five- or six-element primitive inventory.

  - id: DIMENSIONAL-EXTENSION-DERIVABLE
    statement: >
      The primitive inventory at each dimensional level is derivable from the corresponding
      classification theorem rather than chosen; plane-curve symbology is exactly the torsion=0
      slice of the space-curve system.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    notes: >
      Fundamental Theorem of Space Curves: a unique space curve up to rigid motion exists for given
      positive curvature and arbitrary torsion; torsion identically zero iff planar. 3D therefore
      adds one derived axis (torsion) yielding helix, knotting, and chirality — the last provably
      unavailable in the plane, since signed torsion makes left- and right-handed helices
      inequivalent under rigid motion in R^3. Surfaces are classified by principal curvatures,
      giving plane/sphere/cylinder/saddle/minimal, with Gaussian curvature intrinsic by the
      Theorema Egregium (readable from within the surface, no embedding required). This is a growth
      mechanism that expands by derivation — the inverse of the project's historical pattern of
      invention followed by justification.

  - id: COX-STYLE-CHARACTERIZATION
    statement: >
      Any system satisfying independently-motivated desiderata for a semantic notation is isomorphic
      to a single structure S.
    tier: CONJECTURED
    falsified_by: >
      Exhibit two systems satisfying the stated desiderata that are provably non-isomorphic. Note
      this cannot even be attempted until the desiderata are written, so the claim is currently
      unfalsifiable-in-practice and must not be cited as support for anything.
    evidence: research/framework/provable-geometry.md
    notes: >
      The correct form of the claim the RETIRED Unique Grounding Theorem was reaching for. Cox's
      theorem is the template: qualitative, intuitively-appealing requirements for plausible
      reasoning imply any such system is probability theory in disguise, concluding in a
      representation theorem (order isomorphism onto the unit interval). HARD CONSTRAINT, and the
      exact point where the old theorem failed: the desiderata may not mention the target structure.
      The Unique Grounding Theorem defined semantic primitives to mirror geometric ones already
      chosen and presented the forced bijection as proof. Cox's desiderata never mention
      probability. CALIBRATION: Cox's theorem itself required repair — Halpern's counterexamples
      showed it needs additional density/continuity assumptions. Expect the first version to have
      holes.

  # ─── Obstruction theorems (added 2026-08, proof-availability audit) ─────────

  - id: LOBIAN-OBSTACLE
    statement: >
      A self-repairing Cure cannot verify the soundness of its own repairs at equal logical
      strength; trust flows only toward strictly weaker reasoning systems.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    notes: >
      Lob's theorem: no system T at least as strong as PA proves (box phi -> phi) unless it proves
      phi outright. Lobian obstacle: an agent cannot trust its future self, and X can only trust the
      reasoning of a Y with a STRICTLY WEAKER reasoning system. Bites directly because the Cure must
      trust that its repairs preserve invariants. This is a proof, not a risk — no engineering
      effort routes around it. Known escape routes (waterfall constructions with an infinite
      descending trust chain; source-code-visible agents proving mutual cooperation) all pay in
      weakened successors or a changed logic. FORCES AN ARCHITECTURAL DECISION ON PAPER, BEFORE
      IMPLEMENTATION: the Cure is external-and-stronger than what it repairs, OR the design
      explicitly accepts a descending strength chain, OR proof-based self-trust is abandoned for
      something weaker. Absent from this repository until 2026-08 — see FAILURES.md F-016.

  - id: RICE-BOUNDS-SEMANTIC-EQUALITY
    statement: >
      Semantic equality is undecidable for any Turing-expressive representation; sound decidable
      approximation is available via abstract interpretation, at the provable cost of infinitely
      many false positives.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    notes: >
      SCOPE CORRECTED 2026-08 by the R7 sweep (note 021). Rice concerns "any nontrivial EXTENSIONAL
      property of PARTIAL COMPUTABLE FUNCTIONS", i.e. "the extensional content of programs, namely
      the partial recursive functions that programs compute." And explicitly: "intensional, or
      syntactic, properties of program codes are DECIDABLE precisely because they concern the
      program's structure rather than its behavior."
      GIR IS A TYPED GRAPH, NOT A PROGRAM. Unless GIR expressions denote partial computable
      functions, Rice does not apply. The earlier statement — that Rice bounds SEMANTIC-EQUALITY
      from above and that its falsifier was already met — was an unchecked import. See F-023.
      WHAT THIS DOES NOT SHOW: that semantic equality is decidable. Only that Rice never established
      it was not. Undecidability would have to come from the semantics actually assigned.
      CONSEQUENCE FOR PHASE 5: abstract interpretation is a DESIGN CHOICE, not a requirement forced
      by Rice, and the "infinitely many false positives" cost was inherited from the same
      misapplication. On the acyclic strongly-normalizing core, equality-by-normal-form may simply
      work — the Knuth-Bendix plan that predated invoking Rice. The real constraint is confluence
      (Plump), which is separately confirmed. The workaround is
      itself theorem-backed: abstract interpretation gives sound approximation, and Galois
      connections yield a CALCULATIONAL construction where abstraction . concrete-op .
      concretization is provably the best possible approximation. So the semantic checker has a
      derivable design, not a heuristic to tune. Sharp cost (Baldan et al., ICALP 2021): any
      nontrivial abstract property is undecidable, and every decidable overapproximation
      necessarily includes an infinite set of false positives covering all values of the abstract
      domain. NEAR MISS: IR-NORMALIZATION-STRATEGY's acyclic non-Turing-complete core, chosen for
      confluence reasons, is what keeps GIR out of Rice's full reach. That decision is now
      load-bearing for two independent results; reintroducing general recursion re-imports
      undecidability silently.

  - id: AGM-PREORDER-REPAIR
    scope_reviewed: [CURE-REPAIR-DETERMINISM]   # accounted for — the metric-only scope is exactly what the preorder route avoids
    statement: >
      A rational repair operator is exactly one induced by a faithful preorder over interpretations;
      no metric, distance, or convexity is required.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    supersedes: CURE-REPAIR-DETERMINISM
    notes: >
      Katsuno & Mendelzon proved that the functions induced from faithful preorders are PRECISELY
      those satisfying the AGM postulates for revision — an if-and-only-if representation theorem.
      DISSOLVES THE BLOCKER: CURE-REPAIR-DETERMINISM was retired because metric projection onto a
      non-convex admissible region is multivalued (Hilbert projection theorem requires convexity).
      A preorder is not a metric, so minimal change defined by an ordering needs no convexity, no
      distance, and no projection — the three things that broke the original formulation. The
      convexity problem was an artifact of choosing metric projection, never a fact about semantics.
      HONEST STATUS: this makes the problem tractable, not solved. "Find a projection onto a
      non-convex set" (ill-posed) becomes "specify an entrenchment ordering" (a design problem with
      a theorem guaranteeing any admissible choice yields a rational operator). Also supplies the
      mechanism CURE-CONSISTENCY-VS-OPENENDEDNESS needs: epistemic entrenchment is exactly how one
      decides what must hold versus what may change. Generalized beyond propositional logic to base
      revision in arbitrary monotonic logics.

  - id: ORDER-PARAMETER-FROM-SYMMETRY-BREAKING
    statement: >
      The semantic order parameter is derivable from the symmetry-breaking structure G/H rather than
      discoverable by benchmarking candidate metrics.
    tier: CONJECTURED
    falsified_by: >
      Identify the symmetry group G of the disordered phase and residual symmetry H of the ordered
      phase, construct the order parameter on G/H, and find it fails to exhibit the critical
      behaviour that TopSim or context independence do exhibit empirically. Also falsified if no
      well-defined G and H can be identified for semantic systems.
    evidence: research/engineering/obstructions.md
    notes: >
      Landau theory: the existence of an order parameter is directly associated with spontaneous
      symmetry breaking, and because the free energy must respect the system's symmetries, its
      expansion in powers of the order parameter "can be constructed systematically." So the order
      parameter is determined by WHICH SYMMETRY IS BROKEN, and lives in the coset space G/H. This
      replaces the previously-planned empirical search over TopSim / context independence /
      positional disentanglement with a group-theory computation. The research move is "identify G
      and H," not "benchmark three metrics."
      IMPORTANT LIMIT — DO NOT CLAIM NOETHER. Noether's theorem requires a Lagrangian/action
      formulation with continuous symmetries. Semantics has no action principle, so that route is
      unavailable until one is constructed. Landau theory is phenomenological and carries no such
      requirement, which is why it applies and Noether does not. Claiming Noether here would be
      precisely the borrowed-authority move this project has been caught making before.

  # ─── The external anchor (added 2026-08) ───────────────────────────────────

  - id: GEOMETRIC-ANCHOR-ESCAPES-LOB
    statement: >
      Grounding the semantic layer in fixed mathematical structure converts self-verification into
      reference-comparison, which the Lobian obstacle does not bite; the escape covers the semantic
      comparison function only, not the whole system.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    notes: >
      Lob applies to PROOF-BASED SELF-TRUST — a system reasoning about its own provability. "Is my
      representation self-consistent?" is self-referential and Lob bites. "Does my representation
      match the fixed external structure?" is a structural comparison against something that does
      not change, is not a proof about proofs, and Lob never fires. Established pattern in three
      fields: Gentzen proved PA's consistency in PRA + transfinite induction to epsilon_0; type
      checkers have soundness proved externally as metatheory; hardware roots of trust terminate the
      regress in something the system cannot verify.
      IMPORTANT REFINEMENT: the external base need not be STRONGER. PRA is weaker than PA in most
      respects and stronger only in the one respect needed. The anchor must be more TRUSTWORTHY, not
      more POWERFUL — a much easier requirement, and the one a mathematical anchor actually meets.
      SCOPE LIMITS, do not drop these: the implementation performing the comparison remains
      untrusted (TCB shrinks, never vanishes — cf. "for type soundness theorems, only the type
      system itself is not trusted, while runtime semantics are typically taken for granted"); Lob
      still applies to the Cure reasoning about its own repair POLICY; and the mapping from
      representation to mathematical structure must still be specified and checkable — the grounding
      problem is relocated into a concrete engineering task, not dissolved.

  - id: DRIFT-MUST-BE-ABSOLUTE-NOT-RELATIVE
    statement: >
      Semantic drift measured against a maintained baseline is undetectable under common-mode drift;
      the Cure must measure against fixed invariants instead.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    notes: >
      Not an analogy — the identical engineering problem, already solved in metrology. The kilogram
      was defined by the IPK, a platinum-iridium artifact subject to mass drift from surface
      contamination and atomic-level material loss, which lost roughly 50 micrograms against its
      official value over a century. THE STANDARD ITSELF DRIFTED, so drift was unmeasurable in
      absolute terms — comparison was only ever against copies that were also drifting. The 2019 SI
      redefinition replaced the artifact with the Planck constant (h fixed at 6.62607015e-34 J s),
      giving an unchanging basis consistent across time and space, independent of any physical change
      in a prototype. The Cure as currently specified is the IPK design. It should be the post-2019
      design. Structural note: h was a MEASURED quantity whose value was then FIXED BY DEFINITION — a
      conventional act at the base that renders everything downstream non-conventional, the same
      shape as this repo's DESIGN-CHOICE vs discovery distinction.

  - id: ANCHOR-IS-DISTINCTION-AND-INCIDENCE
    statement: >
      The trust anchor is Point and Enclosure — distinction and incidence — not the geometric
      inventory generally, because those are the provably most invariant structures available.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    notes: >
      Metrology's principle is to anchor to the most invariant thing available. ERLANGEN-SURVIVAL-
      RANKING derives that ranking (note 014): Point and Enclosure are the only unconditional
      survivors at the topological level. So the anchor is DERIVED rather than chosen.
      IMPORTANT CONDITION from the derivation: enclosure survives the PROJECTIVE level only on RP2,
      not on R2 — a projective map can send part of a closed curve to infinity. The anchor is
      unconditional ONLY at the topological level, which is a reason to anchor there specifically
      rather than at any earlier level. Connects to ENCLOSURE-IS-DISTINCTION: the surviving primitive is the Layer 0 mark
      via Jordan separation.
      DIMENSION-GENERAL (note 023). Jordan-Brouwer: "a topological (n-1)-sphere in R^n separates
      R^n into two connected regions... one bounded and one unbounded, each of which has the original
      hypersurface as its boundary." Separation generalizes to all dimensions, and a point is
      0-dimensional in every R^n. So BOTH fixed-point survivors are dimension-independent and the
      anchor holds in any dimension — a theorem, not an assumption.
      ANCHOR TO THE MATHEMATICS, NOT TO "THE UNIVERSE." Physical space is not Euclidean; it is curved
      and locally variable, so a physical-geometry anchor reinherits the IPK pathology in new
      costume. The classification theorems hold regardless of physical geometry because they concern
      mathematical structures rather than measurements of space. The mathematical anchor is strictly
      more invariant than a physical one.
      CONSEQUENCE FOR THE GEOMETRIC PROGRAM: demoted to "symmetry clue" under the emergent-
      universality reframe, it returns here as the TRUST ANCHOR — a load-bearing engineering role,
      and a different one from its retired role as foundation.

  # ─── Research methodology under an untrusted literature (added 2026-08) ─────

  - id: EVIDENCE-VERIFIABILITY-RANKING
    statement: >
      Evidence is ranked by how much trust it requires, not by citation weight; no foundational
      claim may rest on a single citation read via summary.
    tier: DESIGN-CHOICE
    rationale: research/method/source-independence.md
    alternatives_considered:
      - "rank by citation count / journal prestige (rejected: exactly the axis a corrupted or biased literature controls)"
      - "accept literature consensus as baseline (rejected: consensus can drift or be pushed — the IPK pathology applied to research)"
    notes: >
      Tiers: (1) proof we can check ourselves — source-independent by construction; (2) primary
      source read directly; (3) convergence across mutually hostile or non-contacting traditions —
      no single actor seeds all of them; (4) reproduction we ran ourselves; (5) single citation via
      summary, which may NOT be load-bearing. Orthogonal to the existing claims.yaml tiers: those
      rank how well established a claim is, this ranks how much trust its evidence requires.
      STRUCTURAL NOTE: this is the same move as DRIFT-MUST-BE-ABSOLUTE-NOT-RELATIVE, applied to
      research rather than to representations. Anchor to what you can verify yourself. A theorem
      does not care who funded it — Gentzen's proof can be checked line by line without trusting
      Gentzen, the journal, or the century. Mathematics is the only evidence whose source is
      irrelevant because verification is available to anyone who does the work.
      COST, honestly: tier-1/2 evidence is slow. Apply to load-bearing claims only or it consumes
      the project. And the research TCB never reaches zero — the goal is small, explicit, and
      mathematical.

  - id: LOOP-ATTRIBUTION-IS-INTERNAL-SO-FAR
    statement: >
      The recurring "found proof it's impossible" loop is attributable to internal asymmetric
      scrutiny rather than to literature corruption, on all seven documented instances.
    tier: ARGUED
    evidence: research/method/source-independence.md
    notes: >
      DISCRIMINATOR: if the literature were seeded, counter-evidence should be systematically hard
      to find — obscure, low-quality, poorly indexed, or absent. If the loop is internal bias,
      counter-evidence sits in plain sight and simply was not sought. On all seven instances
      (F-017) counter-evidence was trivially findable with a single search: Christiansen & Chater is
      in Behavioral and Brain Sciences and heavily cited; AGM/Katsuno-Mendelzon is textbook
      belief revision; Landau theory is undergraduate physics.
      SCOPE — R2 applies to this claim as much as to any other: this bears on SEVEN DATA POINTS. It
      does not test whether any literature is corrupted elsewhere or at levels these questions do
      not reach. Do not cite it as a general refutation of the corruption hypothesis.
      Instrumented going forward by the S7 logging rule, so attribution accumulates evidence rather
      than remaining a standoff.

  - id: CORRUPTION-HYPOTHESIS-MUST-STAY-FALSIFIABLE
    statement: >
      Per-negative logging of whether counter-evidence was easy or hard to find is required for the
      corruption hypothesis to function as a hypothesis rather than as an unfalsifiable frame.
    tier: DESIGN-CHOICE
    rationale: research/method/source-independence.md
    alternatives_considered:
      - "treat absence of supporting research as evidence of suppression (rejected: unfalsifiable, and absences are overwhelmingly explained by nobody having cared)"
      - "ignore the possibility entirely (rejected: literature corruption is documented at smaller scales — industry-funded research, trial suppression, publication bias, the replication crisis)"
    notes: >
      A corruption hypothesis that explains away every disconfirming finding as planted is
      unfalsifiable BY CONSTRUCTION — structurally identical to the D2 failure this project already
      documented, where theory was patched after each disconfirmation until it scored 100%. The
      same discipline that protects against internal bias protects against this. Making it
      measurable keeps it a hypothesis.
      Corresponding discipline on conspicuous absences (S5): an unrun experiment is a WORK ITEM,
      never evidence. Log it, then run it — which converts speculation into tier-4 evidence
      regardless of why the gap existed.

  # ─── Zadrozny scope correction (added 2026-08, note 011) ───────────────────

  - id: ZADROZNY-SCOPE
    statement: >
      Zadrozny's vacuity result applies to UNCONSTRAINED compositionality only; it does not show
      compositionality vacuous once background constraints on syntax and lexical semantics are
      imposed, and the constraints that close his escape hatch are ones this project already
      requires.
    tier: ARGUED
    evidence: research/notes/011-zadrozny-scope/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). Zadrozny (1994) is mathematically sound but achieves
      compositionality by re-encoding meanings in a way that DOES NOT PRESERVE SYNONYMY RELATIONS.
      Critical literature: Kazmi & Pelletier (1998) "Is Compositionality Formally Vacuous?"
      (Linguistics and Philosophy 21:629-633); Westerstahl (1998) "On mathematical proofs of the
      vacuity of compositionality"; Dever (1999); and Janssen (1983) for the equivalent earlier
      result. Their position: "the task of semantics is to identify a meaning assignment that
      respects both what our best syntax tells us about structure and what our best intuitions tell
      us about synonymy - these results do not show compositionality to be empirically empty," and
      "for compositionality to be a substantive constraint it must be paired with background
      constraints on syntax and the semantics of the basic lexical items."
      DO NOT cite Zadrozny as closing the necessity route. It closes the UNCONSTRAINED route only.
      SHARPENED by primary reading (note 019, Stanford Encyclopedia of Philosophy). The escape
      condition is precise: the construction works "provided that the meanings of the simpler
      expressions can be replaced with new 'meanings' from which the old are uniformly recoverable."
      FIX THE LEXICAL SEMANTICS AND THE CONSTRUCTION IS UNAVAILABLE.
      And the constraint list is THREE-part, not two as note 011 recorded: compositionality is
      substantive when "paired with background constraints on syntax, the semantics of the basic
      lexical items, AND the semantics of composites."
      This project supplies candidate fixings of all three: geometric primitives (lexical), the
      composition rules (syntax and composites), and SEMANTIC-EQUALITY (synonymy).
    notes: >
      Consequence: the logical-necessity route is OPEN AND HARD, not dead. It had been recorded as
      dead since note 003 on an over-broad reading of a correctly-proved theorem. This does NOT
      resurrect the retired Unique Grounding Theorem, which failed for circularity — a separate and
      still-fatal defect.
      Found only because the claim was challenged directly. R1 mandates adversarial search on every
      negative, but was written after Zadrozny was already load-bearing, and nothing required
      auditing negatives that predated the rule. See FAILURES.md F-019.

  - id: FIXED-POINT-TABLE-IS-CANONICAL
    statement: >
      Inventories are presentation-dependent below the coarse-graining fixed point, but the
      structure surviving at the fixed point is canonical — derived rather than chosen — so a fixed
      universal symbol table is the table at the fixed point.
    tier: ARGUED
    evidence: research/notes/011-zadrozny-scope/README.md
    notes: >
      CORRECTS an over-general statement. "There is no fixed universal symbol table" and
      ERLANGEN-SURVIVAL-RANKING ("Point and Enclosure survive to the topological level") cannot both
      be stated unqualified — the first was applied at a level where it does not hold.
      Below the fixed point: many presentations, cardinality varies, no privileged choice
      (PRIMITIVE-SETS-ARE-GENERATING-SETS still holds there).
      At the fixed point: distinction (Jordan separation) and incidence. Small, derived, canonical.
      TWO TRADITIONS, TWO CO-PRIMITIVES — the sharpest form, from note 016. The frameworks that pick
      a SINGLE primitive pick either point (constructive: Euclid's postulates, straightedge-and-
      compass) or region (point-free: Whitehead, Tarski's geometry of solids, points reconstructed
      as concentric families of balls). Those are exactly the two co-survivors of the Erlangen
      derivation. THE EXISTENCE OF TWO RIVAL TRADITIONS IS EXPLAINED BY THERE BEING TWO
      CO-PRIMITIVES: each privileges one and derives the other, neither is wrong, neither is
      complete alone.
      CO-PRIMITIVE, NOT A CHAIN — sharpened by note 015. Two independent routes agree that the base
      is a small co-primitive set rather than a descent from one root. (a) The Erlangen derivation
      (note 014) gives Point and Enclosure as CO-survivors at the fixed point, neither prior to the
      other. (b) Modern axiomatizations — Hilbert's Grundlagen, Tarski — take point and line as BOTH
      primitive and undefined, so there is no "point precedes line" ordering. Euclid's point-first
      sequence is expository and is not reproduced by axiomatic geometry. The "everything descends
      from the point" picture is not a mathematical result.
      METHODOLOGICAL CONVERGENCE worth acting on: the symmetry-grid approach to symbol tables and
      the Landau G/H derivation of the order parameter are the same move from two directions. If a
      symmetry group generates the table, the group determines its contents. "Which symbol table"
      and "what are G and H" (ORDER-PARAMETER-FROM-SYMMETRY-BREAKING) are one question, not two.

  # ─── Roster A falsification results (added 2026-08, note 012) ──────────────

  - id: NEWMAN-OBJECTION
    statement: >
      Structural claims are vulnerable to Newman's objection — any domain of sufficient cardinality
      admits a suitable structure — and the framework's answer must be that its privileged relations
      are DERIVED by transformation group rather than stipulated.
    tier: CONJECTURED
    falsified_by: >
      Show that the Erlangen group tower is itself an arbitrary choice with no principled
      justification, in which case the group-theoretic privileging reduces to stipulation and the
      framework inherits Newman's triviality in full.
    evidence: research/notes/012-roster-a-falsification/README.md
    scope: >
      Newman's objection bites PURELY ABSTRACT structural claims — where the only content is that
      some relation with given formal properties exists. Standard responses privilege "natural" or
      "founded" relations (Melia & Saatsi 2006; Carnap's founded relations), which STIPULATE the
      privileging. Do not cite the objection as defeating structural claims generally.
    notes: >
      SAME SHAPE AS ZADROZNY: "you can always construct it that way, therefore the claim is empty."
      Two of the three deepest objections this project faces are that identical move, which is worth
      noticing as a pattern — such arguments are defeated by supplying the constraint the
      construction quietly drops, not by abandoning the claim.
      OUR POSITION IS STRONGER THAN THE STANDARD RESPONSE: Erlangen privileges relations by
      transformation group, and ERLANGEN-SURVIVAL-RANKING is a computation rather than an appeal to
      experience. It is not free, however.
      ANSWER DEVELOPED in note 014, and it is better than the standard response without being
      complete. Klein: a geometry IS a group — you do not select a group to study a pre-existing
      geometry, the group constitutes what the geometry is, so "which group" and "which geometry"
      are one question. Stronger point falling out of the derivation: the tower is NOT unique (one
      may insert conformal, equiaffine, Mobius groups) but THE SURVIVORS ARE DETERMINED BY THE
      TERMINAL GROUP, NOT THE PATH. Any chain ending at Homeo yields the same fixed point, because
      survival at the top depends only on invariance under the largest group. The privileging is by
      the automorphism group of the underlying structure, which is not a choice.
      RESIDUAL LIMIT, stated rather than hidden: this relocates the question to "why is topology the
      minimal structure?" The available answer — that below topology there is no notion of "nearby,"
      hence no notion of a mark being anywhere — connects to Layer 0 and the Jordan result but is an
      argument about what makes space meaningful, not a theorem. Newman is answered better than by
      stipulating natural relations, and not yet fully.

  - id: TOPSIM-INSUFFICIENT
    statement: >
      Topographic similarity does not establish compositional structure and cannot serve as the
      semantic order parameter.
    tier: ARGUED
    evidence: research/notes/012-roster-a-falsification/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). These criticisms target TopSim AS A MEASURE. They do NOT show
      that agent protocols fail to converge, nor that compositionality is absent — only that this
      metric cannot establish it. Do not cite as "emergent communication shows no structure."
    formalization: "TopSim as the operationalization of compositionality — not the convergence claim itself (R3)"
    revival_condition: >
      A measure that distinguishes derivational structure rather than string edit distance.
      Concept-Best-Matching (arXiv 2403.14705) is a live candidate. Zero-shot cross-play
      compatibility is preferable still, being behavioural and metric-independent.
    refutation_tier: "ARGUED — multiple independent papers, consistent finding"
    notes: >
      Steelman before the kill (R6): TopSim would be adequate if message-space edit distance
      reliably tracked semantic composition. It does not — different derivations can yield identical
      edit-distance profiles, so fixed-order concatenation and free-ordered insertion/deletion score
      the same.

  # ─── Roster G: emergent communication (added 2026-08, note 013) ────────────

  - id: SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY
    scope_reviewed: [ICONIC-GROUNDING-ENABLES-CROSSPLAY]   # no effect — this claim rests on the zero-shot coordination literature, not on the sketching result
    statement: >
      Arbitrary symbolic protocols developed by independently trained agent populations are mutually
      unintelligible, because token permutation invariance leaves many equally valid equilibria.
    tier: ARGUED
    evidence: research/notes/013-roster-g-emergent-communication/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). Applies to ARBITRARY SYMBOLIC channels only. Does NOT apply to
      iconic or perceptually anchored channels — see ICONIC-GROUNDING-ENABLES-CROSSPLAY, which is
      the direct counter-case. Do not cite as "emergent protocols never converge" or as evidence
      against emergent universality: class membership does not entail mutual intelligibility (water
      and magnets share critical exponents; you cannot pour a magnet). It IS evidence against any
      reading of UL as a shared code independent systems would simply arrive at.
    notes: >
      "Symbolic channels admit near-permutation invariance over tokens, meaning many equally valid
      equilibria can emerge that are mutually unintelligible across independently trained
      populations." Protocols "devolve into idioglossia — co-adapted protocols that are
      unintelligible to outsiders."
      THE MECHANISM IS THE USEFUL PART: nothing in an arbitrary channel fixes which token means
      what, so every permutation is an equally good equilibrium. That is a precise account of why
      arbitrary symbol systems cannot converge — and it identifies exactly what a notation must
      supply to escape.

  - id: ICONIC-GROUNDING-ENABLES-CROSSPLAY
    scope_reviewed: [SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY]   # accounted for — this claim is the stated counter-case to that scope
    statement: >
      Within a fixed architecture and dataset, increasing population size raises cross-group
      intelligibility in a sketch-based channel, with correlational evidence that perceptual
      grounding mediates it.
    tier: ARGUED
    evidence: research/notes/019-phase1-primary-reads/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). NARROWED SHARPLY after primary reading (note 019). Three limits,
      each stated by the paper itself.
      (1) "Disjoint populations" means TRAINING ISOLATION ONLY: "all agents use identical CNN
      architectures within and across groups", all groups train on the SAME dataset, and disjointness
      is enforced purely by forbidding cross-group communication. This is two runs of one setup that
      were not allowed to talk — NOT independent invention.
      (2) NO ABLATION ISOLATES ICONICITY. The paper varies population size and communication
      topology; it does NOT vary modality. There is no symbolic-vs-sketch comparison at matched
      population size, so it CANNOT establish iconicity as the mechanism. Perceptual-grounding
      evidence is correlational (r = -0.50 to -0.74).
      (3) The emergent iconicity is not human-legible: "sketches remain highly abstract to human
      observers"; "achieving true human-interpretable, iconic communication likely requires
      additional mechanisms."
      NUMBERS: MNIST N=256 gives ZMI mean 0.898 against chance 0.1 with in-group 0.95; CIFAR-10 N=64
      gives ZMI mean 0.460 with in-group 0.60. The headline describes MNIST at large N, not the
      general case, and the two rows differ in N as well as dataset.
      DO NOT cite this as "iconic notation succeeds where symbolic fails" — see F-021.
    notes: >
      Registered CONJECTURED in note 013 specifically to avoid banking a favourable single-source
      result at ARGUED while an unfavourable multi-source result was being downgraded. The primary
      read then narrowed it substantially, which is what that caution was for. Now ARGUED at the
      narrowed statement, on a primary read (S1-2).
      WHAT DOES NOT SURVIVE: the causal claim about iconicity, and the contrast with
      SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY. That contrast was drawn by me across two different
      literatures with different tasks and scales and presented as a controlled comparison. No study
      compared them. See F-021 and trap signature T11.
      STILL LIVE, and now a concrete experiment rather than a citation: run symbolic and sketch
      channels at matched population size. That is the ablation nobody has done, and it would settle
      the iconicity question directly.

  - id: COMPOSITIONALITY-REQUIRES-PRESSURE
    statement: >
      Compositionality does not emerge by default; it requires both compression pressure (a
      transmission bottleneck) and communication pressure (expressivity).
    tier: ARGUED
    evidence: research/notes/013-roster-g-emergent-communication/README.md
    notes: >
      Kirby et al. (2015): compression alone produces degenerate results; both pressures are
      necessary. "Non-compositional languages will not persist over time when the bottleneck on
      cultural transmission is tight."
      KILLS any naive "compositionality is inevitable" reading.
      CANDIDATE READING, flagged as post-hoc and not yet a result: a universality class is defined
      by which operators are RELEVANT, and this names two. Any system under compression +
      expressivity should land in the same class regardless of substrate, and neither pressure is
      human-specific — any finite learner transmitting through a bottleneck faces both. That would
      be the Christiansen & Chater extension with a concrete mechanism.
      TESTABLE, which is what separates it from a rescue: if compositionality appears in any system
      under both pressures across substrates, the universality claim gains a mechanism; if it
      appears only under substrate-specific conditions, the reading fails.
      UNCHECKED LEADS: "compositional structure can emerge without generational transmission"
      (Cognition); compositionality and systematicity emerging in DEEP LINEAR NETWORKS (PNAS) — a
      substrate-independence datapoint owing nothing to agents playing games.

  # ─── Constructive priority (added 2026-08, note 016) ───────────────────────

  - id: CONSTRUCTIVE-PRIORITY-OF-POINT
    statement: >
      In the constructive framework — Euclid's postulates, straightedge-and-compass, drawing — the
      point is prior: points are inputs and lines and circles are outputs. This is load-bearing in
      Euclid, unlike the definitional ordering.
    tier: ARGUED
    evidence: research/notes/016-constructive-priority/README.md
    scope: >
      Holds in the CONSTRUCTIVE framework. Does NOT hold axiomatically — Hilbert and Tarski's plane
      geometry take point and line as co-primitive — and is INVERTED in region-based/point-free
      geometry (Whitehead, Tarski's geometry of solids), where regions are primitive and points are
      reconstructed as concentric families of balls. Cite with the framework named.
    notes: >
      CORRECTS an overreach in note 015, which examined Euclid's DEFINITIONS (which do no work) and
      concluded about Euclid entire. The POSTULATES do the work and are constructive: "Postulates 1,
      2, 3 and 5 assert the existence and uniqueness of certain geometric figures, and these
      assertions are of a constructive nature." Postulate 1 connects any two distinct POINTS with a
      segment; Postulate 3 draws a circle with any POINT as centre.
      The postulates "function as rules constraining what may be drawn in a diagram... the rules of
      the game, not its opening positions." They ARE drawing rules — the pen-on-paper phenomenology
      is what they formalize, not an analogy to it.
      EVIDENCE TIER S1-1, not empirical. Inspecting what a construction procedure requires is not
      measuring a system: it carries no operationalization dependence, so R2a/T10 do not apply. "You
      cannot draw a line without first placing a point" is checkable by anyone and Euclid formalized
      it as Postulate 1.
      INSTRUMENT SELECTS THE PRESENTATION: stylus (contact area -> 0) gives point-first, i.e. Euclid;
      brush or stamp (bounded first contact) gives region-first, i.e. Whitehead. Another instance of
      PRIMITIVE-SETS-ARE-GENERATING-SETS — presentation-dependent below the fixed point.
      PEN-UP IS THE UNMARKED STATE. unmarked -> mark -> generated structure is the opening of Laws of
      Form, reached phenomenologically rather than philosophically. See ENCLOSURE-IS-DISTINCTION.

  # ─── Dimension and the junction axis (added 2026-08, note 023) ─────────────

  - id: DIMENSION-BOUNDS-ICONICITY-NOT-ENCODING
    statement: >
      A 2D notation is dimension-bound for ICONIC representation but not for ENCODING. Higher-
      dimensional structure is fully expressible in a flat notation via symmetry encoding; it is not
      depictable.
    tier: ARGUED
    evidence: research/notes/023-dimension-and-missing-primitives/README.md
    notes: >
      PROOF CASE: Coxeter-Dynkin diagrams. "A Coxeter polyhedron is FULLY DETERMINED by its Gram
      matrix, which can be conveniently described via a Coxeter diagram", and "every uniform polytope
      with pure reflective symmetry [is] representable by a Coxeter-Dynkin diagram." A flat graph of
      labelled nodes completely determines polytopes in arbitrary dimension. Nodes are mirrors; an
      edge labelled k is an angle of pi/k; the polytope is generated by Wythoff construction.
      SO THE 2D SURFACE BOUNDS ICONICITY, NOT EXPRESSIBLE GEOMETRY.
      METHODOLOGICAL CONVERGENCE: a Coxeter diagram is a symbol table on a symmetry grid. The
      symmetry-grid approach that originated UWS is the known-correct method for encoding
      higher-dimensional structure in a flat notation.
      THE COST, AND IT IS A REAL FORK: a Coxeter diagram does not look like its polytope. Iconicity
      is dimension-bound; encoding is not. UWS wants both and cannot have both for higher-dimensional
      content.
      WHAT IS GENUINELY IMPOSSIBLE ICONICALLY: torsion, hence chirality. tau = 0 CHARACTERIZES
      planarity, so torsion is not a feature a plane curve can have — absent by definition, not
      merely hard to draw.
      CAVEAT: "the Coxeter diagram is not necessarily unique — multiple different diagrams can all
      describe a cube but with different underlying symmetries." Complete but not canonical, which is
      PRIMITIVE-SETS-ARE-GENERATING-SETS again.

  - id: JUNCTION-AXIS-MISSING
    statement: >
      Junction topology is a fourth classification axis, invisible to the single-curve axes. Local
      degree is topological and survives to the fixed point; Angle is the degree-2 AND
      tangent-discontinuous cell, an intersection of two axes rather than a primitive of either.
    tier: ARGUED
    evidence: research/notes/024-junction-axis/README.md
    notes: >
      The three axes of KAPPA-STRATIFICATION — curvature, singularity, closure — are all properties
      of a SINGLE CURVE. A notation is marks meeting other marks. Axis 2 classifies corners on one
      curve; a T-junction is three curve-ends meeting at a point, which the classification
      structurally cannot see.
      WHY THIS CANDIDATE SPECIFICALLY: UWS-PERCEPTUAL-GROUNDING, the project's strongest empirical
      result, rests on Changizi et al. finding that 100+ writing systems share CONTOUR-CONFIGURATION
      statistics matching natural-scene junction statistics. That work is ABOUT junction types. The
      project's best evidence points at a primitive its own formalism cannot express.
      REFRAMES AN EXISTING PRIMITIVE: Angle is a degree-2 junction; T is degree 3, X is degree 4. If
      junction degree is the real axis, Angle is not fundamental — it is one cell.
      PREDICTIONS TO CHECK RATHER THAN ASSUME: junction DEGREE is topological and should survive to
      the fixed point; junction ANGLES are metric and should die early, as angle-magnitude did at
      affine.
      DERIVED in note 024. deg(p) = number of connected components of (N(p) intersect K) \ {p} for
      small N(p) — manifestly topological, since a homeomorphism preserves both neighbourhoods and
      components.
      CELLS: deg 0 isolated point; deg 1 free end; deg 2 pass-through (tangent continuous) or ANGLE
      (tangent discontinuous); deg 3 T/Y; deg 4 X; deg n general.
      ANGLE IS REFINED, NOT RELOCATED: it is degree-2 AND tangent-discontinuous — the intersection of
      the junction axis with the singularity axis, not a cell of either alone.
      DEGREE 1 IS UNNAMED in the current inventory. A stroke's free end is a distinct local type the
      notation has never registered. Cheap to add and it falls out of the same derivation.
      SUB-STRUCTURE, and the middle row was NOT predicted: degree is topological and survives;
      CYCLIC ORDER of branches is topological up to reflection and survives; angles between branches
      are metric and die at affine with angle-magnitude.

  - id: FIXED-POINT-IS-COMBINATORIAL-MAP
    scope_reviewed: [SEMANTIC-FORMALISMS-USE-LABELS-NOT-ORDER]   # MATERIAL — see the correction recorded in notes below
    statement: >
      The fixed point of the coarse-graining is the rotation system — the graph plus a cyclic
      ordering of branches at each vertex — not a small inventory of primitives. Separation and
      incidence are aspects of that one object rather than two independent survivors.
    tier: ARGUED
    evidence: research/notes/024-junction-axis/README.md
    priority: 0
    scope: >
      SCOPED TWICE. (a) Note 034 — this is UWS's fixed point. It is NOT established as UL's. No
      independently developed semantic formalism uses cyclic order as load-bearing structure; they
      use LABELLED edges, and AMR explicitly "abstracts away from elements of surface syntactic
      structure such as word order." Where spatial order appears in semantic diagrams it is
      SECONDARY NOTATION — comprehension aid, not formal content. Calling this UL's fixed point
      requires an argument that is currently unsupported. See SEMANTIC-FORMALISMS-USE-LABELS-NOT-ORDER.
      (b) Note 032 — CONNECTED CONFIGURATIONS ONLY.
      SCOPE (a) RE-WEIGHTED 2026-08-12 (notes 039). It rests on
      SEMANTIC-FORMALISMS-USE-LABELS-NOT-ORDER, which note 038 narrowed from "independently developed
      formalisms" (plural) to CONCEPTUAL GRAPHS ALONE, after the AMR evidence was found inadmissible.
      WHAT STANDS: "not established as UL's fixed point" — that is absence of evidence and remains
      true regardless, since nothing has established it either way.
      WHAT DOES NOT: note 034's stronger reading, that this was "the first positive evidence the gap
      may be structural". One formalism is not a survey. The gap is UNBUILT, which was already known;
      the claim that it is likely STRUCTURAL is no longer supported at the strength recorded.
      (c) Note 035 — the map has a DEFENSIBLE role in UP, the bootstrapping layer, even though its
      UL role is doubtful: it minimizes the arbitrary convention two independent parties must share.
      See ROTATION-MINIMIZES-CONVENTION. UWS fixed point: established. UP optimum: argued. UL fixed
      point: not established, with note 034 as evidence against. Heffter-Edmonds is stated for a
      CONNECTED graph, and this entry quoted that sentence verbatim including the word "connected"
      while stating the result without it. See FAILURES.md F-025.
      FOR DISCONNECTED CONFIGURATIONS THE ROTATION SYSTEM DOES NOT DETERMINE AN EMBEDDING. The
      relative NESTING of components — which component lies inside which face of another — is
      information the map does not carry. Face tracing treats each component as embedded on its own
      sphere: two disjoint triangles trace FOUR faces rather than the three they bound in the plane,
      and chi = 2c rather than 2. Verified as a test,
      map::tests::degree_sequence_cannot_see_connectivity.
      CONSEQUENCE: a notation with more than one stroke is disconnected by default, so this claim
      does not cover the general case. It remains complete for connected configurations.
      ALSO: ERLANGEN-SURVIVAL-RANKING and note 014 asked which SINGLE-CURVE primitives survive, and
      that computation stands for single curves. Do not read the two as competing.
    notes: >
      Heffter-Edmonds principle: "every embedding of a connected graph on an orientable surface is
      uniquely determined up to equivalence by its rotation system", and that cyclic order
      "determines the embedding up to homeomorphism." A complete invariant, and a named object.
      UNIFIES THE TWO SURVIVORS: by Jordan-Brouwer the complement of the configuration has connected
      components (faces), and faces are RECOVERABLE from the rotation system by face tracing, with
      Euler V - E + F = 2 tying them together. So Enclosure is derived from the combinatorial map and
      incidence IS the combinatorial map.
      DERIVES WHAT WAS ASSERTED: ANCHOR-IS-DISTINCTION-AND-INCIDENCE claimed distinction AND
      incidence. Note 014 derived distinction (Jordan) and point; incidence was asserted. This
      derives it, and shows the two are one structure.
      THE CANONICAL SYMBOL TABLE AT THE FIXED POINT: a local vertex type is determined by its
      rotation, and for UNLABELLED branches all cyclic orders of n identical things coincide — so
      each degree yields exactly ONE local type. The canonical table is indexed by junction degree
      0, 1, 2, 3, 4, ... Countable, canonical, DERIVED rather than chosen. It is not a 4/5/6-element
      inventory but an infinite family with one entry per degree, of which the current primitives
      occupy degrees 0 and 2. See FIXED-POINT-TABLE-IS-CANONICAL.
      LIMITS: assumes finitely many junctions (reasonable for a notation, not proved necessary);
      determined up to REFLECTION unless orientation is fixed, since reflection reverses every
      rotation; and it is NOT shown that every notation-relevant feature reduces to the combinatorial
      map — curvature demonstrably does not, it dies earlier. The claim is about the fixed point, not
      about the notation as drawn.

  - id: TABLES-ARE-PROJECTIONS
    scope_reviewed: [FIXED-POINT-IS-COMBINATORIAL-MAP]   # no effect — projections of the axis product are independent of connectivity, and this claim never asserted UL relevance
    statement: >
      A symbol table is a projection of the axis product onto a subset of axes. Symbols recur across
      tables because a cell projects into every table; n axes yield C(n,2) two-dimensional tables;
      and the number of live tables falls under coarse-graining to a single indexed family.
    tier: ARGUED
    evidence: research/notes/025-many-tables/README.md
    notes: >
      DERIVED, not observed. The classification of notes 022 and 024 is a product of four axes —
      curvature, singularity, closure, junction degree — so a primitive is a CELL in a
      4-dimensional space. That space is the "super matrix"; a table is a projection of it.
      CORRECTED BY NOTE 026: this treats all axes as the same kind, and they are not. SHAPE axes
      (curvature, singularity, closure, junction) are properties of a configuration; TRANSFORMATION
      axes (orientation, mirroring, scale, translation) are elements of a GROUP acting on
      configurations. The C(n,2) count below applies to SHAPE AXES ONLY. The full structure is
      (shape space) x (group) — a G-set, not an n-dimensional grid. See TWO-KINDS-OF-AXIS.
      TWO CONSEQUENCES FOLLOW IMMEDIATELY. (a) The number of 2D tables is C(n,2): six for four axes.
      (b) EVERY symbol appears in EVERY table, since a cell has a coordinate on each axis and
      projects into all of them at different positions with different neighbours. Recurrence across
      tables is forced, not designed. A symbol's identity is its coordinate vector; a table shows two
      components of it, so adjacency is per-projection — symbols adjacent in one table can be distant
      in another.
      WHY THE TABLES ARE NOT REDUNDANT: projections lose information and different projections lose
      different information. Two cells differing only on the closure axis are identical in the
      (curvature, singularity) table and distinct in any table including closure. No single 2D table
      separates all symbols; the set does, and only jointly. A concrete instance of
      PRIMITIVE-SETS-ARE-GENERATING-SETS.
      SCALE DEPENDENCE: the table count is not fixed. Euclidean has 4 live axes and 6 tables; affine
      fewer; at the topological fixed point only the junction axis survives with closure recoverable
      by face tracing, giving ZERO 2D tables and a single indexed family
      (FIXED-POINT-IS-COMBINATORIAL-MAP). The "super matrix" and the "single canonical table" are one
      object at two scales.
      THE TEST, and it runs opposite to everything else here: n axes give exactly C(n,2) 2D tables,
      so COUNTING THE DISTINCT TABLES ACTUALLY DRAWN GIVES A LOWER BOUND ON THE NUMBER OF AXES —
      including axes never named, only used. 3 axes/3 tables, 4/6, 5/10, 6/15, 7/21. Note 023 found
      the formalism missing an axis the practice had; this lets the practice be read as data about
      the formalism.
      PREDICTION, recorded before the count is known: it exceeds six, because all four derived axes
      are GEOMETRIC and a working notation almost certainly encodes at least one non-geometric axis
      such as orientation, ordering, or a role marker.
      COINCIDENCE RECORDED AS A COINCIDENCE: C(4,2) = 6 and the six-primitive system carried
      "6 = C(4,2) via tetrahedral rectification." Six TABLES is not six PRIMITIVES; matching numbers
      is not matching structure. Interesting only if an independent reason emerges why primitives
      should correspond to pairwise projections, and there is none. Note 017 recorded retrofitting
      such correspondences as this project's documented failure mode.

  - id: TWO-KINDS-OF-AXIS
    scope_reviewed: [FIXED-POINT-IS-COMBINATORIAL-MAP, BINARY-AXES-ARE-HYPEROCTAHEDRAL]   # no effect — the shape/transformation distinction is independent of connectivity and of the polytope exclusion
    statement: >
      Table axes are of two categorically different kinds: shape axes, which are properties of a
      configuration, and transformation axes, which are elements of a group acting on it. The full
      structure is a G-set, and coarse-graining is quotienting by the group.
    tier: ARGUED
    evidence: research/notes/026-transformation-axes/README.md
    notes: >
      SHAPE AXES: curvature, singularity, closure, junction degree — what the mark IS.
      TRANSFORMATION AXES: orientation, mirroring, scale, translation — how the same mark is PLACED.
      EXPLAINS THE HYPER-DIMENSIONALITY: rotation and scale are continuous, so crossing a discrete
      shape classification with a continuous group produces unbounded blow-up. No enumeration
      terminates because one factor is not finite.
      EXPLAINS THE COLLAPSE, and unifies it with Erlangen: "invariant under G" MEANS "constant along
      the G-directions", so the transformation axes are exactly what coarse-graining quotients away.
      The Erlangen programme is not a separate tool applied to the tables — it IS the statement that
      transformation axes are the ones to remove. Shape axes partially survive per notes 014 and 022;
      transformation axes die entirely.
      ONE OBJECT, TWO OPERATIONS: crossing with G explodes the table, quotienting by G collapses it
      to the single indexed family of FIXED-POINT-IS-COMBINATORIAL-MAP.
      NOTED, UNRESOLVED: an empirical UWS table used rows of periodic/open/closed, which blends the
      periodicity value of the curvature axis with the closure axis — a diagonal through the derived
      product rather than a coordinate of it. Neither decomposition is privileged, which is
      PRIMITIVE-SETS-ARE-GENERATING-SETS applying at the level of AXES rather than primitives, for
      the first time.

  - id: NONSTRETCHABILITY-BOUNDS-DRAWING
    scope_reviewed: [FIXED-POINT-IS-COMBINATORIAL-MAP]   # no material effect — the combinatorial-vs-drawn gap holds regardless of connectivity
    statement: >
      There exist combinatorial configurations that no straight-line drawing realizes, so the
      combinatorial map is strictly more expressive than straightedge construction.
    tier: ARGUED
    evidence: research/notes/026-transformation-axes/README.md
    notes: >
      "The Pappus arrangement of 9 lines... is an arrangement of pseudolines which cannot be
      straightened while preserving their face structure — called NONSTRETCHABLE."
      THE FIRST CONCRETE EXPRESSIVENESS GAP FOUND. A face structure can be perfectly coherent as a
      combinatorial map (FIXED-POINT-IS-COMBINATORIAL-MAP) and be undrawable with straight strokes.
      Bears directly on Phase 3 A1, and arrived from the cross/X table rather than from the
      constructibility literature.
      CONTEXT: the cross/X exploration is the classification of LINE ARRANGEMENTS. "Each rank-3
      oriented matroid is equivalent to an arrangement of pseudolines." Growth of simple
      pseudoline arrangements with a marked cell (OEIS A006247), n=3 upward: 1, 2, 3, 16, 135, 3315,
      158830, 14320182, 2343203071, ... reaching 366477801792538 at n=13, with enumeration beyond
      that OPEN. An exploration that "gets very complex very fast" ran into an open enumeration
      problem rather than into a lack of rigour.

  - id: MAP-TO-DRAWING-GAP
    statement: >
      Fixing the combinatorial map does not fix the drawing: the straight-line realization map is
      neither surjective nor simple-fibred. Some maps have empty realization space, and realization
      spaces of a fixed combinatorics can be arbitrarily complex semialgebraic sets.
    tier: ARGUED
    evidence: research/notes/027-status-and-next-research/README.md
    notes: >
      TWO THEOREMS, characterizing the gap from both sides.
      NOT SURJECTIVE — nonstretchability (NONSTRETCHABILITY-BOUNDS-DRAWING): the Pappus arrangement
      of 9 lines is a pseudoline arrangement that cannot be straightened while preserving its face
      structure. Some combinatorial maps have EMPTY straight-line realization space.
      FIBRES ARBITRARILY COMPLEX — Mnev's universality theorem: "every primary semialgebraic set
      defined over Z is stably equivalent to the realization space of some oriented matroid of rank
      3", and "point configurations of a fixed combinatorics can show arbitrarily complicated
      behaviour."
      SO THE GAP BETWEEN COMBINATORIAL STRUCTURE AND DRAWN REALIZATION IS AS COMPLICATED AS
      ALGEBRAIC GEOMETRY GETS. This is the strongest content the expressiveness question (Phase 3 A1)
      has, and it arrived topologically rather than via the constructibility ladder that was planned.
      The constructibility route is now OPTIONAL rather than central.

  - id: DESSINS-PRECEDENT
    statement: >
      Combinatorial maps — the fixed point of this project's coarse-graining — are the same type of
      object as Grothendieck's dessins d'enfants, which are known to carry equivalences across
      permutation groups, field extensions and algebraic curves simultaneously.
    tier: ARGUED
    evidence: research/notes/027-status-and-next-research/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). This establishes that combinatorial maps CARRY ENORMOUS
      MATHEMATICAL CONTENT — it says nothing whatever about MEANING. The absolute Galois group acts
      on the arithmetic side; there is no bridge from semantic content to Galois stability and none
      is suggested. The OBJECT TYPE matches; the theory attached to it is arithmetic geometry.
      DO NOT cite this as evidence that UL exists, that meaning is Galois-structured, or that the
      notation inherits any universality from dessins. It is a structural precedent for the CHOICE
      of fixed point.
    notes: >
      Dessins are "drawings with vertices and edges on topological surfaces"; the theory "describes
      the equivalence of many categories including graphs embedded nicely on surfaces, finite sets
      with certain permutations, certain field extensions, and some classes of algebraic curves",
      with the absolute Galois group acting faithfully. Grothendieck "was fascinated by the fact that
      very simple drawings can encode very sophisticated mathematical information."
      A combinatorial map with a rotation system IS a dessin, up to the bipartite normalization,
      which is a subdivision away.
      WHY IT IS RECORDED AT ALL: it is a PROVEN instance of one structure recurring across unrelated
      domains, which is the shape of result this project has been looking for — and it supports the
      choice of fixed point without supporting any claim about semantics.
      WHY IT IS FENCED: this is exactly the finding that would have been patched into a claim under
      the old regime. F-024's standing check applies — adopt the structure, decline the unearned
      interpretation.

  - id: EXPRESSIVENESS-CHAIN
    statement: >
      The notation's expressiveness chain is meaning -> combinatorial map -> drawing -> constructible
      figure. The lower two links are characterized by theorems; the meaning-to-map link does not
      exist.
    tier: ARGUED
    evidence: research/notes/028-phase3/README.md
    priority: 0
    notes: >
      DRAWING TO CONSTRUCTIBLE FIGURE — characterized by Galois theory. Straightedge and compass
      reaches towers of quadratic extensions; origami reaches cubics and quartics (Beloch fold,
      1936).
      MAP TO DRAWING — characterized by MAP-TO-DRAWING-GAP. Not surjective (nonstretchability) and
      fibres arbitrarily complex (Mnev).
      MEANING TO MAP — DOES NOT EXIST. This is the gap, and note 018 flagged the risk in advance.
      CONSEQUENCE: the constructibility ladder bounds the FIGURE layer completely and says nothing
      about semantic expressiveness. Phase 3's honest output is a LOCATED GAP rather than a bound —
      which is better than a number that quietly presupposed the bridge.
      ACTIONABLE, conditional on the unbuilt bridge: a straightedge-and-compass notation reaches only
      quadratic towers, so expressing content of algebraic degree 3 would require a NEUSIS OR FOLD
      operation — Huzita-Hatori axiom 6. An operation-level requirement derived from a theorem rather
      than from taste.
      HUZITA-HATORI, and the base-6 coincidence DISMISSED on two independent grounds: the seven
      axioms are "not a minimal set of axioms but rather the complete set of possible single folds",
      so fold OPERATIONS are not a basis of MARKS; and the number six is a HISTORICAL ARTIFACT —
      Justin found all seven in 1986, Huzita's 1991 list of six was incomplete, and Hatori recovered
      the seventh in 2001. Six was an enumeration error, not a structure. Dismissal was predicted in
      advance (note 028 section 1).

  # ─── Phase 4 decisions (added 2026-08, note 029) ───────────────────────────

  - id: REGIONS-ARE-FACE-UNIONS
    scope_reviewed: [FIXED-POINT-IS-COMBINATORIAL-MAP]   # MATERIAL — see the correction recorded in notes below
    statement: >
      Spatial regions are unions of faces of the combinatorial map. RCC-8 is the relation vocabulary
      and is decidable by construction, because the region domain is a finite Boolean algebra.
    tier: DESIGN-CHOICE
    rationale: research/notes/029-phase4/README.md
    alternatives_considered:
      - "adopt RCC as an independent spatial semantics layer (rejected: unnecessary — the map already determines its faces by face tracing, and adopting it as a separate layer would import undecidability rather than avoid it)"
      - "point-free regions in continuous space, Whitehead/Tarski style (rejected: the full RCC framework is undecidable over arbitrary regions, and it would reverse the vertex-primitivity of FIXED-POINT-IS-COMBINATORIAL-MAP)"
      - "hand-rolled spatial predicates (rejected: RCC-8 is a standard vocabulary with known semantics; no reason to invent one)"
    priority: 0
    notes: >
      CORRECTED 2026-08-12 (notes 039) — THE CONNECTIVITY LIMIT APPLIES AND WAS NOT CARRIED.
      FIXED-POINT-IS-COMBINATORIAL-MAP is scoped to CONNECTED configurations: for a disconnected
      plane graph the rotation system does not determine an embedding, because the NESTING of
      components — which component lies inside which face of another — is not carried. Face tracing
      then treats each component as embedded on its own sphere, returning four faces for two disjoint
      triangles rather than the three they bound.
      A NOTATION WITH MORE THAN ONE STROKE IS DISCONNECTED BY DEFAULT, so this is the normal case,
      not an edge case.
      EFFECT ON THIS CLAIM: decidability SURVIVES — a disconnected map still yields a finite face
      set, hence a finite Boolean algebra, hence computable RCC-8. But the faces do not correspond to
      the actual planar regions, so the RELATIONS COMPUTED OVER THEM ARE WRONG. Decidable and
      incorrect is worse than undecidable, because nothing signals the failure.
      FIXED 2026-08-12 — the nesting relation is implemented. map.rs now carries a Nesting type: for
      each component, a dart on its own OUTER face and, unless top-level, a dart on the face of the
      container it sits in. faces_planar() traces per component and then IDENTIFIES each component's
      outer face with its container's face; euler_characteristic_planar() reports V - E + F.
      VERIFIED BY TEST: two disjoint triangles trace 4 faces without nesting and 3 with it, and
      Euler gives 1 + c = 3 rather than 2c = 4. Nesting is a no-op for connected maps. And crucially,
      side-by-side versus contained placements yield the SAME face count but DIFFERENT face
      structure — which is precisely the distinction RCC-8 needs and the rotation system alone loses.
      SO THIS CLAIM NOW HOLDS for disconnected configurations, given the nesting data. See
      IMPL-COMBINATORIAL-MAP.
      RCC-8 primitive is a binary C(x,y), "x connects with y", over non-null regions, giving eight
      jointly exhaustive pairwise disjoint relations: DC, EC, PO, EQ, TPP, NTPP, TPPi, NTPPi.
      THE COMPLEXITY IS BAD IN GENERAL: consistency checking NP-complete, entailment co-NP-complete,
      and "while the entire RCC framework is undecidable, subsets can be defined that are decidable."
      THE FIX IS ALREADY IN THE IR. Faces of a plane graph are the connected components of the
      complement — open, disjoint, exhaustive — and are recoverable from the rotation system by face
      tracing. Taking regions as unions of faces makes the region domain the finite Boolean algebra
      2^F over the face set, so every RCC-8 relation is a finite check. Undecidability and
      NP-completeness both come from arbitrary regions in continuous space; a finite domain has
      neither.
      AND IT DISSOLVES THE POINT-FREE TENSION: RCC is point-free (Whitehead lineage) while the map
      has vertices as primitive. They are complementary rather than competing — vertices give
      incidence, faces give regions, one object supplies both. The two traditions of note 016 are
      unified by the same object that unified separation and incidence in note 024.

  - id: CURE-IS-COMPARATOR
    statement: >
      The Cure derives its trust from the external anchor rather than from self-proof: it checks
      representations against a fixed mathematical structure it did not author. It is a comparator,
      not a self-prover.
    tier: DESIGN-CHOICE
    rationale: research/notes/029-phase4/README.md
    alternatives_considered:
      - "Cure external to and stronger than what it repairs (viable but does not say where the stronger system's own trust comes from — defers the problem one level)"
      - "accept a descending strength chain of successors (rejected: pays in monotonically weakening successors, and gives no account of the first link)"
      - "prove the repair policy sound from within (rejected: Lob forecloses it — LOBIAN-OBSTACLE)"
    priority: 0
    notes: >
      Rests on the split in GEOMETRIC-ANCHOR-ESCAPES-LOB: "is my representation self-consistent?" is
      self-referential and Lob bites; "does my representation match the fixed structure?" is a
      comparison and Lob never fires.
      Independently supported by the reading found in the R7 sweep (note 021): "a logical agent
      cannot make a priori claims about the soundness of its own reasoning because soundness involves
      semantic maps beyond the logic's a priori control."
      BINDING CONSEQUENCES. (1) The Cure must NOT be given the job of proving its own repair policy
      sound in general — that is self-referential and blocked. It verifies INDIVIDUAL REPAIRS against
      the anchor. (2) Policy-level soundness is EXTERNAL BY CONSTRUCTION — human review or a separate
      stronger system. This is the architecture, not a gap to close later. (3) This is why the anchor
      work is load-bearing rather than philosophical: without a fixed external structure there is no
      comparator, and without a comparator the only option left is self-proof, which Lob forecloses.

  - id: ENTRENCHMENT-IS-SURVIVAL-ORDER
    statement: >
      The Cure's entrenchment ordering is the coarse-graining survival order: topological invariants
      most entrenched, metric detail least. It is derived from the geometry rather than stipulated.
    tier: DESIGN-CHOICE
    rationale: research/notes/029-phase4/README.md
    alternatives_considered:
      - "stipulate an ordering by hand (rejected: leaves the Cure's last parameter free, and an arbitrary preorder gives a rational-but-unmotivated operator)"
      - "order by frequency or usage statistics (rejected: makes entrenchment contingent on a corpus, and drifts as the corpus drifts — the IPK pathology of DRIFT-MUST-BE-ABSOLUTE-NOT-RELATIVE)"
      - "order by syntactic complexity (rejected: no connection to what the structure preserves)"
    priority: 0
    notes: >
      AGM-PREORDER-REPAIR guarantees a rational operator GIVEN a faithful preorder. Which preorder
      has been the Cure's remaining blocker; this closes it as a research question.
      ORDERING, most to least entrenched: topological (the combinatorial map — incidence, separation,
      junction degree); projective (incidence, cross-ratio); affine (parallelism, midpoints); metric
      (lengths, angles, curvature). When the Cure must give something up it surrenders metric detail
      first and topological structure last.
      WHY IT IS A DERIVATION. (1) The ordering is computed, not chosen — notes 014 and 022 derived
      it, and 022 explained why the axes die in that order, metric then differential then
      topological. (2) It COINCIDES WITH THE ANCHOR: note 007 says anchor to the most invariant
      available, so the most entrenched thing is the anchor. Two independently derived orderings
      agree, which is the check that matters. (3) It is a TOTAL preorder as AGM requires, since
      Erlangen levels are totally ordered and each invariant has a coarsest level at which it
      survives.
      WHAT IT DOES NOT SETTLE: ties within a level need a secondary criterion, and no semantic
      invariant has yet been written as a checkable predicate. This is a specification, not an
      implementation. Phase 5 tests it.

  # ─── Phase 5: the fixed point, in code (added 2026-08, note 030) ───────────

  - id: IMPL-COMBINATORIAL-MAP
    statement: >
      The combinatorial map is implemented as a rotation system with face tracing, degree, Euler
      characteristic and genus, with tests covering Jordan separation and the planar/toroidal
      distinction.
    tier: VERIFIED
    evidence: ul-forge/crates/ul-core/src/map.rs
    notes: >
      FIRST SUBSTANTIVE VERIFIED CLAIM IN THE PROJECT. The previous four are facts about file
      contents (enum variants, function counts); this one machine-checks a derived result.
      Implements (D, sigma, alpha): darts as directed half-edges, sigma the vertex permutation,
      alpha the edge involution. Vertices are orbits of sigma, edges of alpha, FACES of phi =
      sigma . alpha. That is face tracing, and it is what REGIONS-ARE-FACE-UNIONS needs.
      TESTS INCLUDE ENCLOSURE-IS-DISTINCTION AS AN EXECUTABLE CHECK: every simple closed curve
      yields exactly two faces, verified for n = 3..12. Jordan separation is no longer only argued.
      HONEST GAP RECORDED IN THE MODULE DOC: Gir stores edges as an unordered Vec, so it does NOT
      carry a rotation system — a rotation is strictly more information. from_gir uses edge
      insertion order, which is ARBITRARY, and any face structure it reports is the face structure
      of that arbitrary choice. from_rotations is the honest constructor. Supplying real angular
      order from geometry is outstanding work.
      NESTING LAYER ADDED 2026-08-12. A rotation system determines an embedding only for a CONNECTED
      graph, so for disconnected configurations the relative placement of components is genuinely
      extra information — choosing an outer face is choosing a point at infinity, and combinatorially
      no face is distinguished. Nesting supplies it; faces_planar() and
      euler_characteristic_planar() consume it. This is what makes REGIONS-ARE-FACE-UNIONS correct
      for real notations, which are disconnected by default.
      A FAILING TEST WAS INSTRUCTIVE RATHER THAN A BUG: the theta-graph test initially asserted
      three faces while supplying a rotation that embeds the graph on a TORUS. The code was right
      and the expectation was wrong. Both embeddings are now tested — same graph, same degree
      sequence, different surface — which demonstrates the module's central claim that the rotation
      IS the embedding.

  - id: BINARY-AXES-ARE-HYPEROCTAHEDRAL
    statement: >
      The four binary shape axes form a hyper-octahedral structure — 16 cells as tesseract vertices,
      8 poles as 16-cell vertices — but only with the junction axis excluded, because junction degree
      is unbounded and no finite polytope has an infinite axis.
    tier: ARGUED
    evidence: research/notes/031-junctions-and-the-octahedral-question/README.md
    scope: >
      HOLDS for the binary shape axes only. FAILS once junctions are included. Cite with the
      exclusion stated — the unconditional form is false.
    notes: >
      Curvature is not binary but SPLITS into two binary choices: is kappa constant ({Z,C} vs
      {P,V}), then is it the degenerate member (Z vs C, P vs V). That gives four binary axes:
      2 curvature + singularity + closure. 2^4 = 16 cells = tesseract vertices; 4 axes x 2 poles = 8
      = vertices of the dual 16-cell, which is the 4-dimensional cross-polytope, i.e. the
      hyper-octahedron.
      JUNCTION DEGREE IS UNBOUNDED and that obstruction is fatal to any finite polytope over all
      four axes. It is also explanatory: an unbounded axis cannot fold into a closed symmetric
      figure, so it generates an unbounded family instead. That is why the cross/X exploration ran
      into the open pseudoline-arrangement enumeration (NONSTRETCHABILITY-BOUNDS-DRAWING) while the
      octahedral system closes cleanly. The two are structurally different kinds of object — a finite
      polytope over binary axes versus an unbounded family over a countable axis.
      CONCRETE DISCREPANCY, and the first place the derived classification and the existing
      symmetry-grid work make DIFFERENT predictions: a 3D octahedron has 6 vertices = 3 binary axes;
      a 4D 16-cell has 8 = 4 binary axes. The derivation gives four. So either the octahedral system
      is missing an axis, or the curvature split is wrong and should be one atomic axis giving three.
      Checkable rather than a matter of taste, and it is the same open item note 026 recorded from
      the waveform table — one of the two decompositions is doing unnecessary work.
      METHOD: this is a test, not a retrofit. The axes were derived in notes 022 and 024 without
      reference to any octahedral structure, the polytope question was asked afterwards, and it could
      have returned negative. The guard against note 017's documented failure mode is that the answer
      is CONDITIONAL and names its own obstruction rather than being a bare numerical match.

  - id: CONNECTIVITY-AXIS-MISSING
    scope_reviewed: [FIXED-POINT-IS-COMBINATORIAL-MAP]   # already accounted for — this claim IS the connectivity limitation
    statement: >
      Connectivity — the number of components — is a topological axis absent from the classification,
      independent of degree sequence, and not recoverable from the combinatorial map for disconnected
      configurations.
    tier: ARGUED
    evidence: research/notes/032-axis-audit/README.md
    priority: 0
    notes: >
      A hexagon and two disjoint triangles have the SAME degree sequence [2,2,2,2,2,2], the same
      vertex count and the same edge count. No existing axis distinguishes them. Verified as a test:
      map::tests::degree_sequence_cannot_see_connectivity.
      WORSE THAN A MISSING AXIS: for disconnected configurations the rotation system does not
      determine an embedding at all, because relative nesting is not carried. See the scope now
      attached to FIXED-POINT-IS-COMBINATORIAL-MAP.
      SECOND LIKELY OMISSION, not yet derived: ORIENTATION CLASS. Mirror-image configurations are
      distinguishable under an orientation-preserving group and identified under one including
      reflection. Note 024 observed the map is determined "up to reflection" and never made that an
      axis.
      METHOD PROBLEM UNDERNEATH: the axes were LISTED by inspection, not DERIVED. Inspection has no
      completeness criterion, which is why two axes are underdetermined and at least one was missed.
      The principled method is to derive axes from invariant theory level by level, which is what the
      Erlangen hierarchy is for. That derivation is outstanding.

  - id: AXES-HAVE-DIFFERENT-TYPES
    scope_reviewed: [BINARY-AXES-ARE-HYPEROCTAHEDRAL]   # accounted for — this claim explains the exclusion rather than inheriting it
    statement: >
      The classification axes are of four different types — binary, discrete-unbounded, continuous,
      and mixed — and the type determines whether an axis can sit in a finite grid and whether it
      survives coarse-graining.
    tier: ARGUED
    evidence: research/notes/033-axis-types-and-ul-focus/README.md
    notes: >
      TYPES: closure is genuinely BINARY (a curve closes or it does not, no partial closure);
      junction degree is DISCRETE UNBOUNDED (N); curvature is CONTINUOUS and infinite-dimensional
      (kappa is a function, so the axis is a function space); singularity is MIXED (corner count in
      N, positions continuous). Only one of four is binary.
      STRUCTURAL CONSEQUENCE, which explains BINARY-AXES-ARE-HYPEROCTAHEDRAL without needing the
      polytope argument: grids and polytopes need FINITE DISCRETE axes. Closure sits in a grid
      cleanly; junction degree is unbounded and breaks any finite polytope; curvature enters a grid
      only after discretization, which must be canonical or the grid is arbitrary.
      THE DEEPER PATTERN: what survives coarse-graining is TOPOLOGICAL, and topological invariants
      are typically DISCRETE — counts and classes. Metric structure is CONTINUOUS. So the fixed point
      is discrete and the axes that die are continuous. This explains note 032's observation that the
      underdetermined axes are the ones that do not matter: continuous axes are hard to stratify
      canonically because they carry no canonical stratification, which is the same property that
      makes coarse-graining discard them.

  - id: UL-WORK-IS-FIXED-POINT-WORK
    statement: >
      Work on UWS bears on UL only where it concerns the coarse-graining fixed point. Work on metric
      or differential detail is microscopic and, by universality, cannot generalize.
    tier: ARGUED
    evidence: research/notes/033-axis-types-and-ul-focus/README.md
    notes: >
      THE PROBLEM AT ITS SHARPEST: if UL is a universality class then microscopic details do not
      determine the class — that is what universality means. So characterizing UWS's microscopic
      structure tells us NOTHING about UL.
      RE-CUT IN NOTE 038. The original cut was UWS versus UL, which assumed UWS structure is
      arbitrary microscopic detail. UWS is a DERIVED notation, so its derived structure is a
      CANDIDATE FOR the class-level structure rather than one realization among many.
      THE CORRECT CUT IS DERIVED VERSUS CONVENTIONAL, INSIDE UWS: glyph-to-concept assignments and
      the lexicon are conventional and are microscopic detail; the curvature classification, the
      Erlangen survival ordering and the combinatorial map are DERIVED and are not.
      ORIGINAL CUT, superseded: curvature strata and singularity refinements are microscopic and not
      UL-relevant. Closure, junction degree, connectivity and the combinatorial map are class-level
      and are.
      AND THE TWO COINCIDE WITH NOTE 032's FINDING: the metric and differential axes are exactly the
      underdetermined ones. The axes that are hard to pin down are precisely the ones that do not
      matter for UL — the difficulty and the irrelevance have the same cause.
      HONEST ACCOUNTING: notes 022 and 032 spent real effort on curvature strata, which under this
      criterion is one notation's microscopic detail. Partly misdirected. Not wholly — note 022's
      derivation revealed that enclosure lives on a DIFFERENT axis from curvature, which produced the
      fixed-point explanation. The payoff came from the boundary, not the strata.
      ATTENTION AUDIT: 27 claims mention UWS, 4 mention UL. Heavily over-focused.
      THE TEST FOR WHETHER SOMETHING IS UL WORK: a UL result should survive UWS being wrong.
      THREE CONCRETE UL ITEMS, none requiring UWS to be correct: (1) does the combinatorial map
      appear as a fixed point in systems that are NOT UWS — the bridge test; (2) identify G and H for
      the order parameter, better placed now that note 026 supplied the group action; (3)
      coarse-grain independently emerged protocols and check for shared invariants, the standing test
      from note 010, still unrun.

  - id: SEMANTIC-FORMALISMS-USE-LABELS-NOT-ORDER
    scope_reviewed: [DESSINS-PRECEDENT]   # no effect — dessins concern mathematical content, this claim concerns semantic content; the scopes are complementary
    statement: >
      Conceptual Graphs distinguish a vertex's edges by label rather than by cyclic position, and
      spatial arrangement in semantic diagrams is secondary notation. NARROWED from a claim about
      formalisms in general.
    tier: ARGUED
    evidence: research/notes/034-bridge-test/README.md
    scope: >
      Establishes that no other formalism CONVERGED on rotation systems. Does NOT establish that
      rotation systems are semantically empty — see the steelman below. Do not cite as showing
      cyclic order is meaningless.
    notes: >
      NARROWED IN NOTE 038 — THE AMR EVIDENCE IS INADMISSIBLE AND THIS REPO ALREADY KNEW IT. The
      research register records at D2-c that AMR is an "English-only corpus, English predicate
      lexicon, English annotators" and that using it as universality evidence "would reproduce UNL's
      single most documented failure mode", marked "NARROWED (near-miss caught)". The error was
      caught once, recorded, and re-committed. AMR is an annotation convention for an English corpus,
      not an attempt at universal structure, so "AMR uses labels" reflects its design purpose.
      WHAT SURVIVES: Conceptual Graphs remain a legitimate data point. ONE formalism is not
      "independently developed formalisms" — the plural was doing unearned work. The finding is real
      and far weaker than originally recorded.
      ORIGINAL EVIDENCE, retained for the record: AMR is "rooted, directed acyclic graphs where
      vertices represent concepts and LABELLED arcs are used to represent semantic relationships", with PropBank roles ARG0, ARG1, and — decisively —
      "AMR annotation abstracts away from elements of surface syntactic structure such as WORD
      ORDER." Conceptual Graphs are the same family.
      Where node ordering does matter it is for "legible and informative tree layouts" and "visual
      saliency of clusters" — comprehension criteria, i.e. SECONDARY NOTATION. UWS claims spatial
      arrangement is PRIMARY. No other formalism makes that claim.
      STEELMAN (R6), and it survives weakened: rotation and labels are only PARTLY
      inter-translatable. Rotation to labels is trivial — number edges by cyclic position. Labels to
      rotation REQUIRES EXTRA DATA, since nothing in ARG0/ARG1/ARG2 supplies a cyclic successor. So
      rotation is STRICTLY MORE STRUCTURE than labelled distinguishability; the two are not
      equivalent, one refines the other.
      WHICH SHARPENS THE QUESTION RATHER THAN SETTLING IT: either cyclic order is semantically real
      and every other formalism is missing it, or it is spatial overhead carrying no meaning. There
      is a genuine argument for the first, from notes 013 and 019 — cyclic order is INTRINSIC while
      labels require a SHARED VOCABULARY, and two systems can agree on "clockwise from here" without
      agreeing on a label alphabet, which is exactly what cross-population intelligibility needs.
      That is an argument, not evidence, and it now needs testing rather than repeating.
      WHAT THIS COSTS: the convergent-evidence form of the meaning-to-map bridge FAILS. Nobody else
      arrived at rotation systems. DESSINS-PRECEDENT shows combinatorial maps carry deep MATHEMATICAL
      content; this shows they carry no SEMANTIC content anyone else found. The EXPRESSIVENESS-CHAIN
      gap is not merely unbuilt — this is the first positive evidence that it may be structural.
      Not proof, but the cheapest available check ran and did not go our way.

  - id: ROTATION-MINIMIZES-CONVENTION
    scope_reviewed: [SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY, IMPL-CONVENTION-COST]   # symbolic-only scope is what makes rotation the contrasting case; and this claim already states the behavioural half is untested
    statement: >
      A rotation system breaks strictly less arbitrary symmetry than a label alphabet — Z/2
      (orientation) versus S_n — so it minimizes the shared prior two independent parties need to
      interoperate. This places the combinatorial map in UP, the bootstrapping layer, rather than UL.
    tier: ARGUED
    evidence: research/notes/035-protocol-not-semantics/README.md
    priority: 0
    falsified_by: >
      Rotation-based encodings fail to reduce the shared prior required for zero-shot interoperation
      relative to labelled encodings — e.g. if establishing an orientation convention proves as
      costly as establishing an alphabet, or if the relabelling-invariance does not hold in practice.
    notes: >
      THE QUANTIFIED CLAIM: a label alphabet of size n is one choice among n! permutations, all
      equivalent and mutually incompatible, so labelling breaks S_n. A rotation system is invariant
      under relabelling and fixes only an orientation, so it breaks Z/2. The gap grows factorially:
      6, 24, 720, 40320 against 2.
      FORMAL HOME, and it developed independently of notation: Other-Play is "a method of preventing
      conventions that rely on arbitrarily breaking the symmetries of the setting", and the named
      failure mode is agents "arbitrarily converging on one out of many equivalent but mutually
      incompatible policies" — which is exactly the idioglossia of
      SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY, reached from multi-agent RL rather than from notation.
      CONTRIBUTION RATHER THAN BORROWING: that field states as an open problem that "current
      symmetry-based methods assume a priori access to these symmetries, but automatically
      discovering them can be computationally infeasible." A rotation system CARRIES its symmetry
      group explicitly — the cyclic group at each vertex — so it requires no symmetry discovery.
      WHY THIS IS NOT A RETREAT FROM NOTE 034, checked against a guard set before searching: the
      original claim predicted semantic formalisms would converge on rotation, and was falsified. This
      claim predicts rotation-based encodings coordinate zero-shot better than label-based ones,
      which is a DIFFERENT and untested prediction. It also has independent support and addresses a
      stated open problem, rather than relocating to wherever the evidence is absent.
      CROSS-DOMAIN EVIDENCE (note 036), from a field with no connection to notation or geometry:
      music splits exactly along this line. Transposition invariance is cross-culturally universal —
      "a melody played in one key or register is recognised as the same melody when shifted to any
      other", with "a universal logarithmic representation of pitch" and "striking cross-cultural
      similarities" in interval and temporal structure. But OCTAVE EQUIVALENCE, a conventional
      identification, "may be culturally contingent" and is absent in Tsimane' participants.
      THE PART REQUIRING NO SHARED CONVENTION TRAVELS; THE PART REQUIRING ONE DOES NOT.
      CAVEAT, and it matters: the symmetry groups are NOT the same. Transposition invariance is
      invariance under a translation of log-frequency; relabelling invariance is invariance under
      S_n. What is shared is the PRINCIPLE — relational structure travels, conventional
      identification does not — not the group. Do not claim music and rotation systems share a
      structure. The picture in music is also genuinely mixed, with some features biologically
      grounded and others heavily culture-dependent.
      INFORMATION-THEORETIC HALF NOW MACHINE-CHECKED (note 041, IMPL-CONVENTION-COST). map.rs
      implements mirror(), convention_ambiguity() and label_ambiguity(). The substantive test is that
      mirror is an INVOLUTION — mirror . mirror = id — which establishes the orientation group IS
      Z/2, the claim's left-hand side. Label cost is k! arithmetic: 40320 at k=8 against a flat 2.
      THE FAILURE MODE CHECKED FOR AND NOT FOUND: whether reading a rotation system requires vertex
      correspondence, which would smuggle in a naming convention and falsify the Z/2 claim. It does
      not — a combinatorial map is determined UP TO ISOMORPHISM by its structure, so the receiver
      reconstructs without the sender's names. Labels differ in kind: ARG0 versus ARG1 carries
      content not recoverable from structure, so permuting them changes meaning while permuting
      vertex names does not. That asymmetry is the substance of the claim.
      TWO HONEST LIMITS. (1) The "ambiguity <= 2" test is near-tautological — the function returns 1
      or 2 by construction. The bound is STRUCTURAL, established by the involution, and the ambiguity
      function is a consequence rather than independent evidence. (2) signature() is not a complete
      isomorphism invariant, so achiral detection may report 1 for a chiral map. That understates
      ambiguity, which is safe for the bound but makes the achiral count approximate.
      STILL OUTSTANDING AND NOT SUBSTITUTED FOR: the symbolic-versus-rotation ablation at matched
      population size, from note 019. Information and behaviour can differ; the claim that AGENTS
      LEARN rotation-based codes more compatibly remains untested.

  - id: UNIVERSAL-MEANS-CONVENTION-FREE
    statement: >
      In ordinary usage "universal language" means something that travels without a shared
      convention. Under that criterion music's relational structure qualifies empirically, a
      label-based notation does not, and a rotation-based notation is predicted to.
    tier: ARGUED
    evidence: research/notes/036-music-and-love/README.md
    notes: >
      Extracted from two folk claims by stripping the sentiment. "Music is the universal language"
      asserts meaning carried by RELATIONS — intervals, ratios, temporal pattern — with no label
      alphabet. "Love is the universal language" asserts meaning carried by a MODE OF ENGAGEMENT
      rather than transmitted content. NEITHER NAMES A REPRESENTATIONAL SYSTEM, which is the first
      thing worth noticing.
      THE CRITERION IS USABLE: music's relational part qualifies (empirically, see
      ROTATION-MINIMIZES-CONVENTION); love as coupling mode arguably qualifies but is untested; a
      label-based notation does NOT; a rotation-based notation is predicted to and that is the open
      test. So the folk usage is CONSISTENT with ROTATION-MINIMIZES-CONVENTION and INCONSISTENT with
      label-based semantics — a real constraint on what UL could be, extracted from a saying.
      THE LOVE HALF IS ARGUMENT ONLY, no data. Its structural content lands on
      CURE-MONITORS-COUPLING-NOT-CONSISTENCY, on the enaction convergence ("language doesn't
      represent things, language does things"), and on theosis as "participation, not information".
      Recorded as directional, not as support.
      DIRECTIONAL CONVERGENCE, three independent routes: note 034 (the map is not semantic), note 035
      (its defensible role is protocol), and this note (folk claims name non-representational things,
      with music data supporting the convention-minimizing reading). Mild corroboration, not
      evidence.
      HISTORICAL EVIDENCE (note 037): SOLRESOL is the natural experiment. It built a language out of
      music — words from the seven note-names — and failed. Note 036 found music's RELATIONAL
      structure travels while its CONVENTIONAL identifications do not; Solresol took the part that
      travels and converted it into a label alphabet, and it stopped travelling. The one attempt to
      build a universal language out of music failed by turning relations into vocabulary.
      WARNING ATTACHED DELIBERATELY: this is the most agreeable result in many notes — folk
      intuition, empirical data and our own derivation all pointing one way is exactly when motivated
      reading is easiest. The temptation is to conclude "UL is music-like" or "UL is love". NEITHER
      FOLLOWS. What follows is narrow: convention-minimizing structure travels better.

  - id: THREE-KINDS-OF-UNIVERSAL-CLAIM
    statement: >
      "Universal language" names three incompatible claims — an invented notation, a discovered
      structure, and a mode of engagement — with different track records and success criteria. UWS
      is the first kind; the UL question became the second at note 003.
    tier: ARGUED
    evidence: research/notes/037-the-universal-language-landscape/README.md
    notes: >
      KIND A, INVENTED NOTATION — build a system everyone could learn. Leibniz's characteristica
      universalis, Wilkins' Real Character, Dalgarno, Blissymbolics, Solresol, Esperanto, Lojban.
      TRACK RECORD UNIFORMLY NEGATIVE across three centuries: Leibniz's "has never been published; it
      is unknown whether Leibniz ever worked it out in detail"; Wilkins' is "ingenious but completely
      unworkable"; Solresol "didn't inspire many to actually learn the language"; Blissymbolics "was
      not widely embraced" internationally.
      KIND B, DISCOVERED STRUCTURE — there is already an ordering principle and it is language-like.
      Logos, mathematics as the book of nature, Pythagorean number, Sanskrit and Hebrew as divine
      language, and the universality class. This is the ordinary claim of mathematics and physics.
      KIND C, MODE OF ENGAGEMENT — the universal is relation, not content. Love, presence,
      participatory sense-making. Kinds B and C agree that A looks in the wrong place and disagree
      about where to look instead: structure versus relation.
      CORRECTED IN NOTE 038 — THE TAXONOMY COLLAPSED TWO INDEPENDENT DIMENSIONS. It is a GRID, not a
      list: (what it is) notation / structure / relation, crossed with (how arrived at) invented /
      derived / discovered. UWS is NOTATION x DERIVED, a cell the three-kind list had no room for, so
      it was forced into notation x invented purely for being a notation. The criterion should have
      been how the structure is ARRIVED AT, not what kind of object it is — which is exactly what
      distinguishes UWS from Esperanto and Solresol, designed by taste.
      CONSEQUENCE: the 300-year failure record below is a record of INVENTIONS failing. Whether a
      DERIVED notation fares differently is UNTESTED, because nobody has derived one. That cell is
      empty — neither good news nor bad, but the accurate statement.
      EVIDENCE AGAINST THE ORIGINAL CLASSIFICATION, eleven notes long: 022 through 033 each DERIVE
      UWS structure — curvature strata, Erlangen survival, junction axis, combinatorial map, table
      projections. I filed UWS as invented while actively deriving it. "A constructed notation" in
      the glossary is where the reading came from, but constructed does not mean arbitrary.
      SUPERSEDED TEXT FOLLOWS: THE CONSTRAINT THIS PLACES ON US: UWS is a kind-A project. The UL question became kind-B at
      note 003, without the lineage being noticed. THIS IS THE CLEANEST EXPLANATION OF WHY NOTE 034
      FAILED — it tested a kind-B claim (does the structure appear independently?) against an
      artefact of kind-A work (the notation's fixed point). Kind-A artefacts are INVENTED; there is
      no reason for them to appear independently.
      AND IT IS WHY NOTE 035 IS THE RIGHT RELOCATION: UP is neither A nor B. It asks how much shared
      convention two parties need, which is answerable without either building a universal notation
      or discovering a universal structure.
      KIND C PREDICTS ASYMMETRY: a content-based universal is symmetric, the same message working for
      anyone; a coupling-based one requires both parties to participate and cannot be broadcast. Same
      asymmetry as Pearl's hierarchy in CURE-MONITORS-COUPLING-NOT-CONSISTENCY.

  - id: GENETIC-CODE-IS-CONSTRAINED-NOT-DETERMINED
    statement: >
      The genetic code — the only empirically existing near-universal code — is strongly constrained
      by selection yet not uniquely determined, which is the emergent-universality position
      instantiated and a caution about how much any derivation could ever pin down.
    tier: ARGUED
    evidence: research/notes/037-the-universal-language-landscape/README.md
    notes: >
      CONSTRAINED: "the probability to reach the same level of error minimization as in the standard
      genetic code by random permutation of codons is below 10^-6" — the one-in-a-million result. It
      "appears at or very close to a global optimum for error minimization."
      NOT DETERMINED: "the standard genetic code is far from being optimal because, given the
      enormous overall number of possible codes (>10^84), billions of variants are even more robust
      to error."
      SO THE ONE REAL UNIVERSAL CODE IS A FROZEN ACCIDENT THAT SELECTION IMPROVED — historically
      locked in, not derived. Selection constrains without determining; a good solution is reached
      without being THE solution.
      CONSEQUENCE, and it should be adopted as a position rather than discovered later: if the
      genetic code is the model, then CONSTRAINED BUT CONTINGENT is the best UL could be, and no
      derivation would ever pin it down uniquely. That is compatible with UL-IS-EMERGENT-UNIVERSAL
      and incompatible with any revival of the necessity route that expects a unique answer.

  - id: IMPL-CONVENTION-COST
    statement: >
      The convention-cost comparison is implemented and machine-checked: mirror is an involution, so
      the orientation group is Z/2, while label ambiguity is k! and grows factorially.
    tier: VERIFIED
    evidence: ul-forge/crates/ul-core/src/map.rs
    scope: >
      Machine-checks the INFORMATION-THEORETIC half of ROTATION-MINIMIZES-CONVENTION only. It does
      NOT test whether agents learn rotation-based codes more compatibly — that is the behavioural
      claim and needs the ablation from note 019. Do not cite this as confirming the claim entire.
    notes: >
      SUBSTANTIVE TEST: mirror . mirror = id, establishing the orientation group is Z/2. Degree is
      reflection-invariant. Label ambiguity computed as k!: 6, 24, 720, 40320 against a flat 2.
      NEAR-TAUTOLOGICAL TEST, flagged rather than counted: "ambiguity <= 2" checks a function that
      returns 1 or 2 by construction. The bound is structural and follows from the involution.
      APPROXIMATE COMPONENT: signature() (degree sequence plus face-size multiset) is not a complete
      isomorphism invariant, so achiral detection can report 1 for a chiral map — understating
      ambiguity, safe for the bound, imprecise for the achiral count. A complete test needs canonical
      forms.
