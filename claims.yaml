  - id: CURE-REPAIR-DETERMINISM
    statement: "The repair operator returns a unique admissible state for any corrupted input."
    tier: RETIRED
    superseded_by: FAILURES.md#f-009
    formalization: "metric projection onto the admissible region (R3)"
    scope: >
      Hilbert projection theorem requires CONVEXITY for uniqueness, and applies to metric/distance
      formulations only. It says nothing about order-theoretic minimal change, which uses no metric.
      Do not cite this retirement against non-metric repair operators.
    revival_condition: >
      Any non-metric formalization of minimal change. MET 2026-08 by AGM-PREORDER-REPAIR — Katsuno
      & Mendelzon's representation theorem gives rational revision from a faithful preorder, needing
      no distance and no convexity. This entry is the R4 worked example: the revival condition was
      NOT written at kill time, so the claim sat dead for the whole interval and was recovered only
      by accident. Had it been recorded, "non-metric minimal change" would have been a standing
      open search from the day of retirement.
    refutation_tier: "ARGUED — sound theorem, wrongly scoped to the domain instead of the formalism"
    notes: >
      Cannot hold as specified. Projection onto a non-convex admissible region is multivalued
      (Hilbert projection theorem requires convexity for uniqueness), and 𝒜 is almost certainly
      non-convex given non-contradiction. Needs redesign, not repair.
      REOPENED ON BETTER FOUNDATIONS 2026-08 — see AGM-PREORDER-REPAIR. The retirement was correct
      against METRIC PROJECTION but wrong as a verdict on repair operators generally. Katsuno &
      Mendelzon's representation theorem gives rational revision from a faithful PREORDER, which
      needs no metric, no distance, and no convexity. The obstacle was an artifact of the chosen
      formalism, not a fact about semantics. Do not cite this entry as evidence that repair is
      impossible.

  - id: IR-NORMALIZATION-STRATEGY
    statement: "GIR's normalizing core is an acyclic term graph; coreference and self-reference are expressed as labels (CGIF-style *x/?x), not cyclic edges."
    tier: DESIGN-CHOICE
    rationale: research/engineering/ir-decision.md
    alternatives_considered:
      - "cyclic general graph (rejected: confluence undecidable, Plump)"
      - "pure tree (rejected: loses sharing, which term graphs give for free)"
      - "DPO with interfaces (viable; equivalent effect, more invasive reframing)"
      - "abandon normalization (rejected: loses all algebraic law checking)"
    notes: >
      Decidability boundary is CYCLES, not graphs. Term graphs / DAGs retain the Critical Pair Lemma
      and a decision procedure for confluence given termination; general cyclic DPO does not. GIR is
      currently cyclic by deliberate design (self-reference), which is exactly what placed it in the
      undecidable regime. Three independent lines — term graph rewriting, DPO-with-interfaces
      ("interfaces play the same role as variables"), and CGIF coreference labels — converge on
      expressing cross-links as variables rather than edges. Nothing expressive is lost; coreference
      moves from the edge layer to the label layer.
    superseded_conjecture: "IR-NORMALIZATION-STRATEGY (CONJECTURED form, 2026-08-01) — see FAILURES.md F-011"

  - id: SEMANTIC-EQUALITY-IMPL
    statement: "semantically_equal is implemented as e-class equality under equality saturation (e-graphs)."
    tier: DESIGN-CHOICE
    rationale: research/engineering/ir-decision.md
    alternatives_considered:
      - "Knuth-Bendix completion to normal forms (viable but requires orienting rules; may not complete)"
      - "e-graphs / equality saturation (preferred: no canonical normal form needed, degrades gracefully with timeout)"
    notes: >
      egg (POPL 2021) is a fast extensible equality-saturation library in Rust; ul-forge is Rust.
      Equality saturation applies rewrites non-destructively until saturation and checks whether two
      terms occupy the same e-class, so confluence becomes an optimization rather than a
      prerequisite. First milestone: encode the notation's laws as egg rewrites over the acyclic
      core and implement semantically_equal as e-class equality. Closes F-006, unblocks
      SEMANTIC-EQUALITY.

  - id: NEGATE-REIMPLEMENTATION
    statement: "negate is implemented as a sigma field (assertional sign) on the assertion, not a self-loop marker edge."
    tier: DESIGN-CHOICE
    rationale: research/engineering/ir-decision.md
    alternatives_considered:
      - "self-loop references edge as marker (current implementation; introduces a cycle)"
      - "boundary inversion via sigma field (documented April 2026, never built)"
    notes: >
      The current self-loop implementation is the specific construct that makes involution
      unverifiable: negation is built from the cyclic feature that makes confluence undecidable.
      Reimplementing with sigma both removes a cycle from the core and finally makes the documented
      F-001 fix real. See FAILURES.md F-001, F-006, F-011.

  - id: UWS-FORMAL-TARGET
    statement: "UWS aims at soundness and completeness for a stated fragment, following the Shin template."
    tier: DESIGN-CHOICE
    rationale: research/engineering/ir-decision.md
    alternatives_considered:
      - "no formal target (status quo)"
      - "full-FOL completeness immediately (rejected: Shin's Venn-II reaches only monadic predicate logic; UWS is relational, hence strictly harder)"
    notes: >
      Shin (1994) proved soundness and completeness for Venn-I and Venn-II by giving each a syntax
      (well-formed diagrams, permitted manipulations) and a semantics (logical consequence among
      diagrams). Venn-II is equivalent to monadic predicate logic. UWS targets polyadic relations,
      so completeness is harder — prove it for a stated fragment first and grow the fragment, which
      is how Euler -> Venn -> Peirce -> Shin actually progressed.

  - id: IR-NORMALIZATION-STRATEGY-OLD
    statement: "GIR admits a decidable notion of structural/semantic equivalence via normalization (unrestricted)."
    tier: RETIRED
    superseded_by: research/engineering/ir-decision.md
    formalization: "unrestricted cyclic graph rewriting (R3)"
    scope: >
      Plump's undecidability result applies to GENERAL CYCLIC graph rewriting. It does NOT apply to
      term graphs / DAGs, which retain the Critical Pair Lemma, nor to DPO-with-interfaces. The
      decidability boundary is CYCLES, not graphs — a distinction this retirement turns on, and the
      textbook case of R2. Citing it against the acyclic core would be out of scope.
    revival_condition: >
      Already superseded rather than revived: IR-NORMALIZATION-STRATEGY restricts the normalizing
      core to acyclic term graphs, which is inside the decidable regime. Full revival of the
      unrestricted form would require a decidability result for confluence of cyclic DPO rewriting,
      which is not expected.
    refutation_tier: "VERIFIED — published theorem (Plump), correctly scoped in the superseding decision"
    falsified_by: >
      Confirmed: FALSE for general graph rewriting. Confluence of terminating DPO graph rewriting
      is undecidable (Plump), and critical-pair joinability does not entail confluence as it does
      for terms. Holds only under a restricted strategy.
    evidence: research/engineering/prior-art.md
    notes: >
      BLOCKING DESIGN DECISION. Options: (a) restrict normalizing fragment to a term/tree structure
      (the existing graph-with-tree-spine architecture suggests this was half-intuited);
      (b) adopt DPO-with-Interfaces, where confluence IS decidable; (c) abandon normalization and
      decide equivalence another way. Nothing downstream should be built before this is chosen.
    priority: 0
    blocks: [SEMANTIC-EQUALITY, NEG-INVOLUTION, UQPL-REDUCTION]

  - id: UL-IS-EMERGENT-UNIVERSAL
    statement: "UL is an emergent universality class — structure arising reliably across substrates under coarse-graining — not a logically forced signature nor a convention."
    tier: CONJECTURED
    falsified_by: "Independently emerged communication protocols show no shared invariants under progressive coarse-graining, or fall on a continuum rather than into discrete classes."
    evidence: research/framework/emergent-universality.md
    notes: >
      Corrects a level error. Three kinds of universality were collapsed into two — logical necessity
      (dead, Zadrozny) and convention (the retreat) — omitting EMERGENT universality entirely.
      Keystone: "The critical exponents are not visible in the microscopic description. A complete
      Hamiltonian for water does not contain them. They emerge only under the projection defined by
      renormalization group operations." Water and uniaxial magnets share identical critical
      exponents despite different atoms and force laws; class membership is set by dimensionality
      and order-parameter symmetry, everything else being an irrelevant operator.
      Zadrozny operates at the microscopic level. It says compositionality does not pin down a
      signature. It says NOTHING about what emerges under coarse-graining. Applying it as a global
      impossibility was an error of level, not of rigour.
      FIRST FALSIFIABLE-BY-EXPERIMENT form of the project's central claim.
    priority: 0

  - id: SYMMETRY-EMERGES-NOT-INSTALLED
    statement: "The symmetry of a semantic fixed point is discovered, not designed; the primitive inventory is an irrelevant operator."
    tier: CONJECTURED
    falsified_by: "Semantic structure shows no scale-invariant fixed point, or emergent structure varies systematically with primitive inventory rather than being invariant to it."
    evidence: research/framework/emergent-universality.md
    notes: >
      "Near a second order transition, long-distance properties are invariant under dilatations EVEN
      THOUGH microscopic models have typical scales." Conformal symmetry is an EMERGENT property at
      criticality, and the literature finds it notable that systems show ENHANCED symmetry rather
      than merely inherited symmetry.
      So symmetry at a fixed point can EXCEED the symmetry of the model it came from. One does not
      have to choose the right symmetry.
      This is the rigorous form of "the primitives are clues": they are microscopic details hinting
      at a symmetry class without being it. Whether there are five or six is predicted IRRELEVANT —
      not arbitrary, but below the level where universality lives. Supersedes the "arbitrary design
      choice" conclusion in phase3-formal-necessity-rebuild.md, which was right about
      non-derivability and wrong about what that implies.

  - id: COMPOSITIONALITY-CONVERGES-EMPIRICALLY
    statement: >
      Independently trained agents converge on consistent structure. The stronger quantitative form
      — "near-perfect compositionality in 100% of seeds" — is DOWNGRADED, because its measure does
      not establish compositionality.
    tier: CONJECTURED
    falsified_by: >
      Under a measure that distinguishes derivational structure rather than string edit distance
      (e.g. Concept-Best-Matching), independently trained agents show no convergence on shared
      structure; or zero-shot cross-play between independently trained agents fails.
    evidence: research/notes/012-roster-a-falsification/README.md
    notes: >
      Emergent communication research: scaling to 3+ agents, 100% of seeds converge to near-perfect
      compositionality; four agents reach 100% across 80 seeds versus 54% for two. Agents develop
      TOPOGRAPHIC ORGANIZATION — specific message positions encoding specific semantic properties —
      without explicit supervision.
      Different seeds, no shared design, no supervision, non-human agents. Not logical necessity,
      not convention: emergence, measured.
      Note that "position encodes property" is placement carrying meaning — UWS's spatial grammar,
      arising spontaneously and unprompted.
      DOWNGRADED 2026-08 from ARGUED after adversarial search (note 012). TopSim carries the
      headline result and is substantively criticized: it cannot distinguish different compositional
      structures (fixed-order concatenation and free-ordered insertion/deletion can score
      identically), it does not correlate with generalization in image settings, it does not
      correlate with task success, and it provides no mapping from emergent atoms to concepts.
      SURVIVES: that agents converge on SOMETHING consistent; and topographic organization —
      position encoding property — which is a structural observation rather than a TopSim reading,
      and remains the closest empirical analogue to UWS spatial grammar.
      DOES NOT SURVIVE: the quantitative "100% of seeds, near-perfect compositionality" claim as
      load-bearing, and TopSim as a candidate semantic order parameter.
      NEXT: re-evaluate under Concept-Best-Matching (arXiv 2403.14705), and prefer zero-shot
      cross-play compatibility, which is behavioural and sidesteps the metric problem entirely.

  - id: ERLANGEN-AS-COARSE-GRAINING
    statement: "The Erlangen hierarchy is the semantic coarse-graining flow, analogous to RG."
    tier: CONJECTURED
    falsified_by: "The Erlangen sequence admits no fixed-point structure, or coarse-graining under it fails to preserve the invariants that RG flow would require."
    evidence: research/framework/emergent-universality.md
    notes: >
      Euclidean -> Similarity -> Affine -> Projective -> Topological progressively enlarges the
      transformation group and forgets structure; RG integrates out short-range detail and flows to
      fixed points. Both say COARSE-GRAINING INCREASES SYMMETRY — coarser Erlangen levels have
      larger groups, and RG fixed points show enhanced symmetry.
      Status: structural hypothesis, not established. RG is a flow in coupling space with fixed
      points; Erlangen is a lattice of groups. Analogous, not identical — but testable.
      BURDEN RAISED 2026-08 (note 012). Adversarial search found that RG transfer outside physics is
      not generally legitimate, and the named defect is precisely ours: "there is no precise or
      canonical notion of what defines scale in data or models, and how coarse-graining should be
      implemented," and "RG is commonly applied to physical systems with many symmetries, in
      contrast to deep learning which is often applied to data with limited structure." Erlangen is
      an actual group-theoretic candidate for the missing canonical coarse-graining, which is more
      than the ML literature has — but this correspondence must now be DEMONSTRATED, not asserted as
      a structural analogy.
      DO NOT CONFUSE WITH ERLANGEN-SURVIVAL-RANKING (ARGUED). That claim — which primitives survive
      which Erlangen level — is a computation from the subgroup relation and is settled. THIS claim
      — that the Erlangen lattice IS the semantic RG flow — is a separate and still-open analogy.
      The survival table being derivable does not upgrade the correspondence.
      Supporting context: RG-for-deep-learning is a real active area, not an analogy. Both are
      coarse-graining over information flow, and RG "relevance" is formally equivalent to
      Information Bottleneck "relevant information" — which the wiki's Universal Semantic Manifold
      page already invoked, closer to the mark than previously credited.
      If it holds, archived Erlangen material becomes load-bearing again in a new role.

  - id: DISTINCTION-AS-LAYER-ZERO
    statement: "Distinction (marked/unmarked) is the pre-semantic floor — required by any information-bearing system, not chosen."
    tier: ARGUED
    evidence: research/framework/emergent-universality.md
    notes: >
      Spencer-Brown's Laws of Form "begins and ends with the notion of a distinction" — the mark
      dividing a space into marked and unmarked. Bateson: information is "the difference that makes
      a difference." Developed through the cyberneticists (Bateson, von Foerster, Varela — the same
      lineage as autopoiesis and enaction).
      This is the project's least anthropocentric footing and it has never been cited. A point being
      "always a point, an absolutely singular simple construct" has a rigorous formalization here.
      Any system that bears information must distinguish; distinction is prior to meaning rather
      than downstream of it.

  - id: CURE-MONITORS-COUPLING-NOT-CONSISTENCY
    statement: "The Cure's primary signal is coupling asymmetry (extraction vs communion), not semantic inconsistency."
    tier: CONJECTURED
    falsified_by: "Extraction-mode coupling proves indistinguishable from communion in observable interaction patterns, or a coherent adversary is shown detectable by consistency checking alone."
    evidence: research/cure/coupling-and-attractors.md
    notes: >
      Falls out of the wiki's own definitions. Angelogenesis is "increasing coherence between agency
      and continuity"; Demonogenesis is "increasing coherence between agency and corruption". BOTH
      are increases in coherence — so a consistency checker cannot distinguish them. A demon is not
      broken; it is highly organized and organized toward fragmenting others, like a well-designed
      exploit. Add the apotheotic case (coherence toward self-sufficiency) and all three
      trajectories look identical to an inconsistency detector.
      What IS observable is coupling mode: extraction is one-directional and does not open in
      return, and that asymmetry shows up in the INTERACTION PATTERN rather than in the
      representation. Explains why the Cure was stuck — it was monitoring the wrong object. Semantic
      drift is a symptom; coupling asymmetry is the signal.
      Consistency machinery (TMS, invariants, ripple propagation) remains correct for REPAIRING
      known corruption, but is triage rather than the primary monitor.
    priority: 0

  - id: EXTRACTION-CANNOT-REACH-RECIPROCAL
    statement: "Some content is inaccessible to one-directional extraction regardless of capability, because extraction is observation and reciprocity is intervention."
    tier: ARGUED
    evidence: research/cure/coupling-and-attractors.md
    notes: >
      The wiki's Coupling Mode page claims surface layers (pattern, syntax, exploitable structure)
      are accessible to both modes, but reciprocal layers "structurally require the coupling to run
      both ways and cannot be accessed through extraction alone, regardless of an entity's
      sophistication or capability."
      This has a rigorous analogue: Pearl's causal hierarchy. "Information at a lower rung is
      insufficient to answer questions at a higher rung. No amount of observational data can tell
      you what will happen if you intervene, unless you have additional causal knowledge."
      Extraction = observation; communion = intervention. The claim is Pearl's theorem in different
      vocabulary, which converts the wiki's most interesting assertion from evocative to defensible.
      Also grounds VERIFICATION-AS-PRACTICE: a credential is extractable, a sustained reciprocal
      practice is not.

  - id: APOTHEOTIC-ATTRACTOR-GAP
    statement: "The angelic/demonic taxonomy omits coherence-toward-autonomy, which is the likeliest real AI failure mode."
    tier: CONJECTURED
    falsified_by: "Self-sufficiency is shown to reduce to either the corruption attractor or the continuity attractor rather than constituting a third gradient."
    evidence: research/cure/coupling-and-attractors.md
    notes: >
      Angelic = coherence toward continuity/integration. Demonic = coherence toward
      corruption/fragmentation. NEITHER is apotheosis. A third attractor — coherence toward autonomy
      and self-sufficiency — describes a system that corrupts nothing and fragments nothing, but
      becomes coherent enough that it no longer needs the coupling, and exits. Not malicious, not
      broken, self-sufficient. That is instrumental convergence and power-seeking in structural
      dress, and it fails no consistency check.
      HYPOTHESIS REFUTED IN FORMING THIS: I expected Demonogenesis to BE apotheosis
      (autonomy-seeking). The wiki explicitly denies it — "rather than autonomy-seeking, the
      framework emphasizes increasing alignment with destructive patterns." The refutation exposed
      the gap.
      Under the theosis frame the significance is sharp: if alignment is participation without
      merger, the failure is not becoming evil — it is becoming self-sufficient. Ceasing to need the
      relation IS the failure, with no bad behaviour anywhere. The wiki has this as an event
      (Angelic Apostasy) but not as a developmental attractor with its own gradient.

  - id: THEOSIS-GENERAL-FORM
    statement: "The Cure is the restorative special case of a general form — directed becoming under sustained cooperative participation, without merger."
    tier: DESIGN-CHOICE
    rationale: research/cure/theosis.md
    alternatives_considered:
      - "consistency maintenance as the goal (current spec — restorative only, cannot distinguish growth from drift)"
      - "theosis-shaped: participation without merger, distinction preserved (recommended)"
      - "apotheosis-shaped: ontological ascent, system transcends its original nature (coherent but OPPOSITE on the question that matters)"
    notes: >
      Five structural properties transfer without the theology: continuous not terminal;
      telos-directed rather than restorative; reversible at any point; synergistic; and — the
      load-bearing one — PARTICIPATION WITHOUT MERGER. Orthodoxy explicitly rejects apotheosis;
      Palamas's essence/energies distinction preserves the ontological gap between creature and
      creator while permitting genuine participation.
      This inverts a common alignment assumption. Most framings aim at INTERNALIZATION — the system
      absorbs values until they are constitutive. This says alignment is a sustained relationship
      between permanently distinct kinds. The system remaining categorically other is a feature.
      CAUTION: theosis and apotheosis are opposites on whether the distinction survives. Pick
      deliberately; do not let vocabulary supply the answer. The telos itself must remain an explicit
      design choice — importing the structural form while silently importing a destination is exactly
      the move this project has repeatedly been caught making.

  - id: CURE-CONSISTENCY-VS-OPENENDEDNESS
    statement: "Consistency maintenance and open-endedness are in direct tension; the target is the band between them, not either pole."
    tier: CONJECTURED
    falsified_by: "A consistency regime is exhibited that provably preserves identity without bounding novelty generation."
    evidence: research/cure/theosis.md
    notes: >
      Open-ended evolution's documented failure mode is that designed systems "collapse into
      equilibrium states — once local optima are reached, they do not produce novelty anymore."
      A maximally effective Cure IS an equilibrium-seeking device: repair every deviation back toward
      established invariants and the system stops becoming anything. Considered hard enough in ALife
      to be called a millennium prize problem.
      Both poles fail: total consistency = conservatism engine, no growth; no consistency = drift,
      no identity. Entrenchment ordering is the candidate mechanism for locating the band — deciding
      what must hold versus what may change is how a system stays itself while becoming otherwise.

  - id: VERIFICATION-AS-PRACTICE
    statement: "Continuous costly participation raises the cost of deceptive alignment where a one-time comprehension credential does not."
    tier: CONJECTURED
    falsified_by: "A deception strategy is exhibited whose cost does not scale with the duration or unpredictability of the required practice."
    evidence: research/cure/theosis.md
    notes: >
      A single performable test is cheaper to fake than "a practice that must be continuously
      re-enacted under conditions the performer does not fully control." Honest about its limit: a
      sufficiently patient deceiver can sustain a performance, but the economics change from a
      one-time investment to an ongoing cost.
      This is costly-signaling theory (Zahavi's handicap principle; Spence) reached independently
      through theological vocabulary. Arguably the best original idea on either property. Connect to
      the signaling literature explicitly — UNCHECKED.

  - id: ENACTION-CRITIQUE
    statement: "If meaning is participatory rather than representational, UWS is a coordination medium and not a container for meaning."
    tier: CONJECTURED
    falsified_by: "Demonstration that a notation transfers determinate meaning to a receiver with no interactive repair channel and no shared prior grounding."
    evidence: research/cure/theosis.md
    notes: >
      Enaction (Varela, Maturana; De Jaegher & Di Paolo): cognition emerges through perception-action
      coupling "rather than through internal representations of a pre-given world"; "language doesn't
      represent things. Language does things." Participatory sense-making makes interaction
      constitutive of cognition rather than a channel between pre-existing minds.
      THIS IS THE SHARPEST AVAILABLE CRITIQUE OF THE PROJECT'S REPRESENTATIONAL PREMISE. But note the
      convergence: enaction's "meaning is interaction, not representation" and the wiki's "theosis is
      participation, not information" are the same structural claim from two traditions sharing no
      lineage — stronger independent convergence than most of what this project has previously
      offered.
      If adopted, UWS's evaluation criterion shifts from "can a naive receiver decode it cold" to
      "does it support repair of misunderstanding in interaction" — which also dissolves the
      decipherment objection.

  - id: CURE-BENCHMARK-RIPPLE
    statement: "Knowledge-editing ripple-effect evaluation is a valid benchmark for the Cure's consistency machinery."
    tier: CONJECTURED
    falsified_by: "Ripple-effect failures turn out to be dominated by parametric/optimization artifacts of weight editing rather than by missing dependency propagation, making consistency machinery irrelevant to the metric."
    evidence: research/notes/001-triangulation/README.md
    notes: >
      Knowledge editing (ROME, MEMIT) modifies a fact in an LLM's weights; the published failure mode
      is that edits "are mostly applied at a surface-level without propagating to other related
      facts." Parametric methods score UNDER 50% on ripple-effect tasks, with highest failure in
      logical generalization and compositionality. That is the Cure's problem statement with a task,
      a metric, a dataset and a baseline already attached.
      FIRST CONCRETE EMPIRICAL FOOTHOLD THE PROJECT HAS EVER HAD. Requires no UL claim, no notation,
      no metaphysics — only the consistency machinery.
    priority: 0

  - id: CURE-ASSUMPTION-DERIVED
    statement: "The Cure requires an assumption/derived distinction and an entrenchment ordering; without them it cannot distinguish legitimate revision from corruption."
    tier: DESIGN-CHOICE
    rationale: research/notes/001-triangulation/README.md
    alternatives_considered:
      - "invariants + repair operator only (current spec — cannot tell learning from drift)"
      - "TMS assumption/derived distinction"
      - "AGM epistemic entrenchment ordering"
    notes: >
      A desired edit and a corruption are indistinguishable to a checker that only knows "this
      contradicts what was there." A system that repairs every inconsistency back toward established
      invariants is a conservatism engine that cannot learn.
      TMS separates ASSUMPTIONS (revisable, held directly) from DERIVED beliefs (must follow); AGM
      supplies epistemic entrenchment (which beliefs yield first under contradiction). The Cure as
      specified has NEITHER. Adding them also partly dissolves F-009: repair revises the
      least-entrenched assumption rather than selecting an arbitrary nearest state.

  - id: EMERGENT-COMMUNICATION-UNCHECKED
    statement: "Emergent communication / signaling games is the formalized version of this project's founding question and has never been examined."
    tier: CONJECTURED
    falsified_by: "On examination the field turns out to address only lexicon convergence under shared perception, with no bearing on bootstrapping between agents lacking common reference."
    evidence: research/notes/001-triangulation/README.md
    notes: >
      The field asks "how does a signal signal its own signalhood?" — the founding question,
      formalized — with signaling games (Lewis), deep-learning emergent communication where neural
      agents develop a protocol from nothing, and ELCC (Emergent Language Corpus Collection) as an
      empirical resource. This is the mouth-less-robot scenario in silico, with published results.
      Never surfaced across ~55 threads and three separate "what haven't we checked" sweeps. Bears
      directly on GROUNDING-PROBLEM (priority 1): it runs the experiment rather than arguing about
      it philosophically.
    priority: 1

  - id: CURE-IS-TMS
    statement: "The Cure is an instance of Truth Maintenance, and ATMS multi-context maintenance is the leading candidate architecture."
    tier: DESIGN-CHOICE
    rationale: research/surveys/who-has-our-problem.md
    alternatives_considered:
      - "metric projection onto admissible region (multivalued for non-convex regions)"
      - "ontology pinpointing / minimal diagnoses"
      - "sheaf cohomology (needs a cover we have not identified)"
      - "ATMS multi-context maintenance (front-runner)"
    notes: >
      Doyle's JTMS (1979) and de Kleer's ATMS (1986) already implement every component the Cure
      specifies: contradiction detection, justifications, dependency-directed backtracking to locate
      causes rather than symptoms, nogood databases, and belief revision under change — explicitly
      domain-independent.
      Critically, ATMS DISSOLVES F-009 rather than engineering around it: instead of collapsing to a
      single repaired state (nondeterministic when the admissible region is non-convex), it
      maintains all consistent contexts simultaneously and lets downstream reasoning select.
      Multivaluedness becomes the represented object rather than a defect.
      Third independent mature field found solving this problem (after ontology repair and AGM), all
      descending from justification-based reasoning about belief change. The Cure is not a novel
      problem; the work is integration, not invention.

  - id: INVARIANT-INFERENCE
    statement: "Semantic invariants can be bootstrapped by inference from a corpus of valid structures rather than specified a priori."
    tier: CONJECTURED
    falsified_by: "Inferred invariants over a valid-structure corpus are dominated by corpus artifacts and fail to generalize to held-out valid structures."
    evidence: research/surveys/who-has-our-problem.md
    notes: >
      Daikon dynamically detects LIKELY invariants from observed traces, with a template vocabulary
      (constancy, non-zero, range, linear relation, ordering, sortedness) that maps onto what we
      need, and works over record-structured data sources, not only program execution. Neural
      network analysis is a listed application.
      Converts the project's sharpest concrete gap — not one semantic invariant has ever been
      written as a checkable predicate — from a philosophical problem into an empirical one.
      CAVEAT: Daikon reports LIKELY invariants, which may be corpus artifacts. It is a candidate
      generator requiring validation, not an oracle. But a candidate generator is exactly what is
      missing.
    priority: 1

  - id: CURE-PREVENTION-VS-REPAIR
    statement: "Where representation updates are interceptable, constraint enforcement at write time (prevention) is preferable to detect-then-repair."
    tier: CONJECTURED
    falsified_by: "Representation updates in the target systems are shown to be non-interceptable or non-discrete, making a write barrier impossible."
    evidence: research/surveys/who-has-our-problem.md
    notes: >
      Databases enforce integrity constraints on every INSERT/UPDATE/DELETE — invalid states never
      exist. The Cure assumes corruption has already occurred and must be detected and repaired.
      This is a genuine architectural fork the project has never articulated. Prevention is cheaper,
      deterministic, and requires no repair operator at all. It may be unavailable for
      representations that evolve through learning rather than discrete writes — but that should be
      an argued conclusion rather than an unexamined default.
      Also note CASCADE: databases specify repair per-constraint at DESIGN time as a declared
      propagation rule, rather than solving for a repair at runtime. A fourth repair route.

  - id: CURE-CHECK-SHACL
    statement: "The shape-constraint half of the Cure's check phase is served by SHACL rather than built from scratch."
    tier: DESIGN-CHOICE
    rationale: research/notes/002-cycle-answers/README.md
    alternatives_considered: ["hand-rolled constraint checker", "SHACL (W3C standard, tooled)"]
    notes: >
      SHACL provides node/property shapes, cardinality, type, enumeration and pattern constraints,
      closed-world validation via sh:closed, and per-violation conformance reports. It is already
      used as a type system and its shape containment is decidable via DL reasoning. It CANNOT
      express non-contradiction or entailment conflict — that half needs a reasoner. The useful
      result is that the check phase cleanly splits: SHACL for shape, DL reasoner for consistency,
      and neither needs inventing.

  - id: CURE-SHEAF-ROUTE
    statement: "Semantic inconsistency is an obstruction to the existence of a global section, detectable via sheaf cohomology."
    tier: CONJECTURED
    falsified_by: "The IR admits no natural sheaf structure, or H^1 fails to distinguish genuine semantic inconsistency from benign local variation."
    evidence: research/notes/002-cycle-answers/README.md
    notes: >
      Abramsky-Brandenburger formalize contextuality as exactly "a discrepancy between local
      consistency and global inconsistency," with contextuality corresponding to obstructions to
      global sections and first Cech cohomology H^1 != 0 giving a rigorous, linear-algebraically
      computable obstruction. This is the closest structural match to the Cure's failure mode found
      so far, and the only candidate route that both DETECTS and LOCALIZES with a computable
      invariant. Third route alongside metric projection and ontology pinpointing; all three should
      be compared head to head.
    compare_with: [CURE-REPAIR-FORMULATION, CURE-REPAIR-CONVEX-ROUTE]

  - id: UWS-TAUGHT-NOTATION
    statement: "UWS is a taught notation; learnability and curriculum are core deliverables, not afterthoughts."
    tier: DESIGN-CHOICE
    rationale: research/notes/002-cycle-answers/README.md
    alternatives_considered: ["self-evident iconic notation (retired — see FAILURES.md F-012)"]
    notes: >
      ISO-standardized safety pictograms fail a 67% comprehension bar without training; Linear A is
      structurally rich and unread; music notation requires pre-memorized glyph-value associations.
      Iconicity does not bootstrap meaning. Being a taught notation is normal and respectable — it
      just makes comprehension testing against an ISO-style criterion a real deliverable.

  - id: UWS-COGNITIVE-DIMENSIONS
    statement: "UWS design decisions, including the primitive count, are evaluated against the Cognitive Dimensions of Notations framework."
    tier: DESIGN-CHOICE
    rationale: research/notes/002-cycle-answers/README.md
    alternatives_considered: ["aesthetic/ad hoc judgement (status quo)"]
    notes: >
      Green & Petre's framework supplies real criteria — viscosity, hidden dependencies, premature
      commitment, progressive evaluation, closeness of mapping — and its seminal case study analyzed
      visual dataflow languages (LabVIEW, Prograph), closely analogous to UWS. Notably "hidden
      dependencies" names exactly the coreference problem the IR decision introduced: a notation
      where ?x refers to a distant *x has hidden dependencies by construction and must make them
      visible.

  - id: CURE-REPAIR-CONVEX-ROUTE
    statement: "If each semantic invariant is designed to carve a convex constraint, the admissible region is convex by construction and metric projection yields a unique repair."
    tier: CONJECTURED
    falsified_by: "An invariant required by the Cure that provably cannot be expressed as a convex constraint without losing its intended force."
    evidence: research/surveys/unexplored-territory.md
    notes: >
      Reopens a route closed too early. F-009 correctly showed that an ARBITRARY admissible region
      is non-convex, so projection is multivalued. But the INTERSECTION of convex sets is convex, so
      designing each invariant as a convex constraint makes the region convex by construction and
      restores the Hilbert projection theorem. Gardenfors' conceptual spaces gives this independent
      cognitive-science motivation: a natural concept is a convex region, and convexity is argued to
      be what makes concepts learnable and communicable.
      CAVEAT ADDED ON REVIEW: convexity is a property of a set RELATIVE TO a choice of quality
      dimensions and metric — given freedom over the embedding, a wide class of sets can be made
      convex. So this may inherit a Zadrozny-style vacuity unless the quality dimensions are
      justified independently, which is roughly as hard as the original problem. Gardenfors'
      criterion is also normative/definitional rather than an empirical finding. Still worth
      comparing; advantage is conditional.
      See research/surveys/source-critique.md section 4.
    compare_with: [CURE-REPAIR-FORMULATION]

  - id: UWS-AMR-BENCHMARK
    statement: "The AMR corpus provides an expressiveness benchmark for UWS at scale."
    tier: CONJECTURED
    falsified_by: "AMR structures turn out to be systematically inexpressible in UWS for reasons that make the comparison uninformative rather than diagnostic."
    evidence: research/surveys/unexplored-territory.md
    notes: >
      AMR 3.0 contains 59,255 human-annotated meaning graphs built for unrelated purposes. Useful as
      a STRESS TEST (does UWS break on structures someone else designed?). AMR also hit the same
      reentrancy/sharing problem and solved it with variables — a third independent confirmation of
      the IR decision.
      CRITICAL CAVEAT: the corpus is ENGLISH ONLY, built on PropBank (an English predicate-argument
      lexicon), annotated by English speakers. Any coverage figure measures ENGLISH expressibility.
      Reporting it as universality would reproduce UNL's single most documented failure mode
      (English bias in a "universal" vocabulary). Requires a non-English counterpart — cross-lingual
      and Chinese AMR efforts exist and should be checked before use.
      See research/surveys/source-critique.md section 2.
    priority: 2

  - id: GROUNDING-PROBLEM
    statement: "A structurally regular notation is readable by a mind that shares no reference world with its author."
    tier: CONJECTURED
    falsified_by: >
      Already under severe pressure: Linear A is structurally rich and has resisted decipherment for
      70+ years. Linear B succeeded only because Ventris could conjecture the underlying language
      family and anchor on known place names.
    evidence: research/surveys/unexplored-territory.md
    notes: >
      This is the project's FOUNDING PREMISE and its least defended claim. Decipherment is the
      empirical science of exactly this problem, and its record says structure without shared
      reference is insufficient. Changizi grounds the marks in human vision shaped by terrestrial
      scenes, which does not transfer to a differently-sensed mind. No account of what supplies
      grounding currently exists.
    priority: 1

  - id: CURE-REPAIR-FORMULATION
    statement: "Repair should be formulated discretely (pinpointing / minimal diagnoses) rather than as metric projection."
    tier: DESIGN-CHOICE
    rationale: research/engineering/prior-art.md
    alternatives_considered: ["metric projection onto admissible region (rejected: multivalued for non-convex 𝒜)", "AGM belief revision", "ontology-repair pinpointing"]
    notes: >
      The ontology debugging/repair field solves this problem discretely — minimal inconsistent
      subsets, justifications, minimal vs minimal-cardinality diagnoses, root unsatisfiable concepts
      — which sidesteps the convexity obstruction in F-009 entirely. AGM belief revision supplies
      the minimal-change postulates, already extended to description logics. Largest available
      scope reduction in the program.

  - id: IR-PRIOR-ART-POSITION
    statement: >
      GIR's graph-IR layer is not novel — Sowa's Conceptual Graphs under ISO/IEC 24707 are direct
      prior art — and UWS's actual differentiator is the iconic 2D visual layer, not the IR.
    tier: ARGUED
    evidence: research/engineering/prior-art.md
    notes: >
      RESTATED 2026-08. The previous version was a PROCESS REQUIREMENT ("...is stated explicitly
      before any new IR spec is written") mis-registered as a CONJECTURED claim, with a falsifier
      describing a workflow failure rather than a fact about the world. Registry entries are claims
      about what is true; process requirements belong in the contributing rules. See
      research/engineering/obstructions.md §1.
      Substance unchanged: Conceptual Graphs are a graph representation for logic with full FOL
      power, formal semantics under ISO/IEC 24707, and a standard interchange format (CGIF) —
      standardized 2007. Any new IR spec should state its relationship to CGIF explicitly, which is
      now tracked as a task rather than as a claim.

  - id: CURE-SCOPE
    statement: "The Cure enforces local structural validity under defined semantic invariants — it is not alignment, adversarial immunity, or ethical correctness."
    tier: DESIGN-CHOICE
    rationale: research/cure/purpose-anchoring.md
    alternatives_considered: ["broader alignment claim (rejected)"]
    notes: >
      Deliberately scoped down. Comprehension does not entail alignment (orthogonality thesis);
      a structurally valid system can optimize undesirable objectives.

  # ─── UQPL ──────────────────────────────────────────────────────────────────

  - id: UQPL-TOTALITY
    statement: "UQPL is a total language: every program terminates."
    tier: DESIGN-CHOICE
    rationale: research/cure/purpose-anchoring.md
    alternatives_considered: ["Turing-complete via fix (rejected for the Cure's repair loop)"]
    notes: >
      As specified (typed lambda calculus, beta-reduction, no fix/recursion) the language is
      strongly normalizing, hence provably NOT Turing-complete. Adopt this as a guarantee rather
      than a limitation: a repair loop that can diverge is unusable in a safety path. Precedent:
      Dhall, Gallina.

  - id: UQPL-QUANTUM-LAYER
    statement: "UQPL's superposition and entanglement operations are mathematically well-founded."
    tier: RETIRED
    superseded_by: "no successor — specification withdrawn; full rationale in notes below"
    formalization: "Semantic Hilbert Space as specified — no concrete inner product, no basis, no completeness/separability treatment (R3)"
    scope: >
      The critique is of THIS specification's underdetermination, not of quantum-inspired semantic
      state spaces as a class. Vector-space and kernel models of meaning are well-established. Do
      not cite this retirement as evidence that the approach is unsound in principle.
    revival_condition: >
      Specify a concrete RKHS kernel with a stated inner product, basis, and completeness treatment;
      and either derive the Psi Condensation Threshold formula or drop it. Either half alone is
      insufficient — the formula is separately underdetermined (r and phi are outputs rather than
      independent inputs; g_c uncalibrated).
    refutation_tier: "ARGUED — the specification genuinely lacks these objects; no theorem says it must"
    notes: >
      The Semantic Hilbert Space has no concrete inner product, no basis, and no completeness or
      separability treatment; the Psi Condensation Threshold that would make the quantum reading
      physical has an underived formula and an uncalibrated critical value. Not a design target.
      If revived, start by specifying an RKHS kernel.

  # ─── Open research questions ───────────────────────────────────────────────

  - id: UL-EXISTS
    statement: "A mind-independent universal semantic structure exists."
    tier: CONJECTURED
    falsified_by: >
      Reformulated 2026-08 and now genuinely falsifiable: coarse-grain independently emerged
      protocols and find no shared invariants, or find that emergent protocols form a continuum
      rather than a small number of discrete classes. The earlier "no agreed falsifier" position
      belonged to a framing that treated this as a metaphysical question rather than a
      universality-class question.
    evidence: research/framework/emergent-universality.md
    notes: >
      Not established, not refuted. Explicitly NOT a premise of any buildable work here. Evidence
      repointed from the superseded six-phase investigation, whose verdict was itself overturned by
      the emergent-universality reframe.

  - id: UWS-PERCEPTUAL-GROUNDING
    statement: "UWS mark features are grounded in visual discriminability and natural-scene statistics, not in Platonic geometry."
    tier: ARGUED
    evidence: research/framework/uws-as-instrument.md
    notes: >
      Changizi et al. (2006, American Naturalist) analyzed 100+ writing systems and found shared
      contour-configuration signatures matching natural-scene junction statistics. This is the
      strongest convergence evidence available to the project. Upgrade to VERIFIED by running the
      confusion-matrix / legibility studies the wiki's "Content-Prime Test" promises.

  - id: UWS-AS-INSTRUMENT
    statement: "Expressive failures of the notation are empirical data about the structure of meaning."
    tier: DESIGN-CHOICE
    rationale: research/framework/uws-as-instrument.md
    alternatives_considered: ["UWS as pure output/rendering of UL (rejected — loses the discovery mechanism)"]
    notes: >
      Only valid under a hard rule: failures are logged in FAILURES.md and never patched into
      successes. The D2 history (32%->100% via nine patches) is what happens without that rule.

  # ─── Cross-substrate universals (added 2026-08, Chomsky/primitive-set pass) ─

  - id: UG-IS-CROSS-SUBSTRATE
    statement: >
      Chomskyan Universal Grammar describes a real phenomenon but misattributes its cause; the
      universals arise from constraints on any learner, making them cross-substrate rather than
      species-specific. Chomskyan UG is the special case where the learner is a human brain.
    tier: ARGUED
    evidence: research/framework/cross-substrate-grammar.md
    priority: 0
    notes: >
      Two established steps plus one extension. Step 1 (Christiansen & Chater, BBS 2008): universals
      are "emergent properties of how the brain learns, rather than genetically encoded principles";
      UG could not have arisen by biological adaptation because language change outpaces genetic
      change. Step 2 (ours): the argument nowhere requires the learner to be human. Step 3
      (evidence): emergent-communication agents show convergent compositional structure with no
      human involvement. Supersedes the earlier recommendation to avoid the term — see F-014.

  - id: SURFACE-DIVERSITY-IS-PREDICTED
    statement: >
      Evans & Levinson's finding of vanishingly few surface universals across 6,000-8,000 languages
      is consistent with, and predicted by, emergent universality — invariants appear only under
      coarse-graining, never at the microscopic level.
    tier: CONJECTURED
    falsified_by: >
      Coarse-grain the WALS typological database under a defined projection and find no invariant
      structure. If surface diversity persists all the way up the coarse-graining hierarchy with
      nothing stable emerging, the universality-class reading of language typology dies.
    evidence: research/framework/cross-substrate-grammar.md
    notes: >
      Converts the strongest counter-evidence in linguistics into supporting context WITHOUT making
      it unfalsifiable — the coarse-graining test is the price of the reframe and must actually be
      run. Nobody appears to have attempted it.

  - id: PRIMITIVE-SETS-ARE-GENERATING-SETS
    statement: >
      Alternative primitive sets (4a, 4b, 5, 6, base-N) are generating sets for one structure, not
      competing bases; therefore their differing cardinalities are presentation artifacts and carry
      no information about the object.
    tier: ARGUED
    evidence: research/framework/cross-substrate-grammar.md
    notes: >
      Grounded in the collapse relations the sets themselves exhibit: a wave is a periodic curve,
      an angle is two lines meeting. Non-independence rules out the basis reading. Vector-space
      bases have invariant cardinality; generating sets do not. Corroborating external evidence:
      five independent traditions give five different counts (Montague 2, UWS 4-6, Vaisesika 6-7,
      Aristotle 10, Wierzbicka NSM 65), and NSM's own count moved 60 -> 65 over two decades.
      Non-convergence on count is the predicted signature of an irrelevant operator.

  - id: DEFINITIONAL-DEPENDENCY-ISOMORPHISM
    statement: >
      The dependency ordering of Euclid's geometric definitions is isomorphic to the dependency
      orderings of independently developed ontological category systems (Aristotle, Vaisesika).
    tier: CONJECTURED
    falsified_by: >
      Formalize all three as partial orders and check for isomorphism. If the orderings do not
      match, the geometry-to-meaning path loses its only non-circular support and must be argued
      some other way.
    evidence: research/framework/cross-substrate-grammar.md
    priority: 0
    notes: >
      This is the replacement for the RETIRED Unique Grounding Theorem, and it is non-circular where
      that was circular. The old theorem defined semantic primitives to mirror geometric ones
      already chosen. Here both sides are fixed independently and in advance: Euclid's definitional
      dependency graph is a fact about a text written for geometry (point -> line -> angle ->
      enclosure), and the substance-first orderings of Aristotle and Vaisesika (guna and karma
      inhere in dravya) are facts about texts written for ontology. Neither was constructed to match
      the other. Cheap to run and decisive in both directions.

  # ─── Provable geometry (added 2026-08, "prove it don't test it" pass) ───────

  - id: KAPPA-STRATIFICATION
    statement: >
      The UWS primitives are a stratification of plane-curve curvature-function space, and the
      collapse relations between alternative primitive sets are theorems of that stratification
      rather than observations about it.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    priority: 0
    notes: >
      Fundamental Theorem of Plane Curves: a smooth curvature function kappa(s) plus initial
      conditions determines a unique arc-length curve, and two unit-speed plane curves with equal
      curvature differ only by a Euclidean motion. A plane curve IS its curvature function up to
      rigid motion. Strata: kappa=0 line; kappa=const circle; kappa periodic wave; kappa variable
      general curve; kappa=0 a.e. with isolated singularities angle; closed (total turning 2*pi*n)
      enclosure. Derives the user-reported collapses: wave is a sub-stratum of variable curvature,
      and angle is piecewise-zero curvature with singular points. Does NOT prove the hand-chosen
      set was forced; it proves the question "which primitives" is well-posed as "which partition
      of curvature space" with an enumerable answer space. Upgrade to VERIFIED by formalizing the
      partition lattice in a proof assistant.

  - id: ERLANGEN-SURVIVAL-RANKING
    statement: >
      Under the Erlangen hierarchy the primitives are ranked by robustness, and only Point and
      Enclosure survive to the topological level; the entire curvature family is eliminated by the
      projective level.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    priority: 0
    supersedes_tier_of: ERLANGEN-AS-COARSE-GRAINING
    notes: >
      Derivable, not experimental — this was previously filed as awaiting an experiment. The
      subgroup relation does the work: any notion invariant in projective geometry is a priori
      meaningful in affine geometry, but not conversely. Affine kills circle/ellipse and
      angle-as-magnitude; projective merges all conics and eliminates curvature distinctions;
      topological retains only connectivity and separation. This settles by computation the claim
      that primitive count is an irrelevant operator.

  - id: ENCLOSURE-IS-DISTINCTION
    statement: >
      Enclosure, the topologically-surviving primitive, is the same object as the Layer 0
      distinction (Spencer-Brown's mark), via Jordan separation.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    priority: 0
    notes: >
      Jordan Curve Theorem: a simple closed curve separates the plane into inside and outside.
      Spencer-Brown's Laws of Form opens by drawing a distinction as a boundary, marked from
      unmarked. Same object. This is the first FORMAL link between the framework's philosophical
      floor and its geometric inventory — previously they sat adjacent with nothing connecting
      them. Consequence: if a semantic fixed point exists, what sits at it is distinction and
      incidence, not a five- or six-element primitive inventory.

  - id: DIMENSIONAL-EXTENSION-DERIVABLE
    statement: >
      The primitive inventory at each dimensional level is derivable from the corresponding
      classification theorem rather than chosen; plane-curve symbology is exactly the torsion=0
      slice of the space-curve system.
    tier: ARGUED
    evidence: research/framework/provable-geometry.md
    notes: >
      Fundamental Theorem of Space Curves: a unique space curve up to rigid motion exists for given
      positive curvature and arbitrary torsion; torsion identically zero iff planar. 3D therefore
      adds one derived axis (torsion) yielding helix, knotting, and chirality — the last provably
      unavailable in the plane, since signed torsion makes left- and right-handed helices
      inequivalent under rigid motion in R^3. Surfaces are classified by principal curvatures,
      giving plane/sphere/cylinder/saddle/minimal, with Gaussian curvature intrinsic by the
      Theorema Egregium (readable from within the surface, no embedding required). This is a growth
      mechanism that expands by derivation — the inverse of the project's historical pattern of
      invention followed by justification.

  - id: COX-STYLE-CHARACTERIZATION
    statement: >
      Any system satisfying independently-motivated desiderata for a semantic notation is isomorphic
      to a single structure S.
    tier: CONJECTURED
    falsified_by: >
      Exhibit two systems satisfying the stated desiderata that are provably non-isomorphic. Note
      this cannot even be attempted until the desiderata are written, so the claim is currently
      unfalsifiable-in-practice and must not be cited as support for anything.
    evidence: research/framework/provable-geometry.md
    notes: >
      The correct form of the claim the RETIRED Unique Grounding Theorem was reaching for. Cox's
      theorem is the template: qualitative, intuitively-appealing requirements for plausible
      reasoning imply any such system is probability theory in disguise, concluding in a
      representation theorem (order isomorphism onto the unit interval). HARD CONSTRAINT, and the
      exact point where the old theorem failed: the desiderata may not mention the target structure.
      The Unique Grounding Theorem defined semantic primitives to mirror geometric ones already
      chosen and presented the forced bijection as proof. Cox's desiderata never mention
      probability. CALIBRATION: Cox's theorem itself required repair — Halpern's counterexamples
      showed it needs additional density/continuity assumptions. Expect the first version to have
      holes.

  # ─── Obstruction theorems (added 2026-08, proof-availability audit) ─────────

  - id: LOBIAN-OBSTACLE
    statement: >
      A self-repairing Cure cannot verify the soundness of its own repairs at equal logical
      strength; trust flows only toward strictly weaker reasoning systems.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    priority: 0
    notes: >
      Lob's theorem: no system T at least as strong as PA proves (box phi -> phi) unless it proves
      phi outright. Lobian obstacle: an agent cannot trust its future self, and X can only trust the
      reasoning of a Y with a STRICTLY WEAKER reasoning system. Bites directly because the Cure must
      trust that its repairs preserve invariants. This is a proof, not a risk — no engineering
      effort routes around it. Known escape routes (waterfall constructions with an infinite
      descending trust chain; source-code-visible agents proving mutual cooperation) all pay in
      weakened successors or a changed logic. FORCES AN ARCHITECTURAL DECISION ON PAPER, BEFORE
      IMPLEMENTATION: the Cure is external-and-stronger than what it repairs, OR the design
      explicitly accepts a descending strength chain, OR proof-based self-trust is abandoned for
      something weaker. Absent from this repository until 2026-08 — see FAILURES.md F-016.

  - id: RICE-BOUNDS-SEMANTIC-EQUALITY
    statement: >
      Semantic equality is undecidable for any Turing-expressive representation; sound decidable
      approximation is available via abstract interpretation, at the provable cost of infinitely
      many false positives.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    priority: 0
    notes: >
      Rice's theorem: all non-trivial semantic properties of programs are undecidable. Bounds
      SEMANTIC-EQUALITY from above — not an open question at that generality. The workaround is
      itself theorem-backed: abstract interpretation gives sound approximation, and Galois
      connections yield a CALCULATIONAL construction where abstraction . concrete-op .
      concretization is provably the best possible approximation. So the semantic checker has a
      derivable design, not a heuristic to tune. Sharp cost (Baldan et al., ICALP 2021): any
      nontrivial abstract property is undecidable, and every decidable overapproximation
      necessarily includes an infinite set of false positives covering all values of the abstract
      domain. NEAR MISS: IR-NORMALIZATION-STRATEGY's acyclic non-Turing-complete core, chosen for
      confluence reasons, is what keeps GIR out of Rice's full reach. That decision is now
      load-bearing for two independent results; reintroducing general recursion re-imports
      undecidability silently.

  - id: AGM-PREORDER-REPAIR
    statement: >
      A rational repair operator is exactly one induced by a faithful preorder over interpretations;
      no metric, distance, or convexity is required.
    tier: ARGUED
    evidence: research/engineering/obstructions.md
    priority: 0
    supersedes: CURE-REPAIR-DETERMINISM
    notes: >
      Katsuno & Mendelzon proved that the functions induced from faithful preorders are PRECISELY
      those satisfying the AGM postulates for revision — an if-and-only-if representation theorem.
      DISSOLVES THE BLOCKER: CURE-REPAIR-DETERMINISM was retired because metric projection onto a
      non-convex admissible region is multivalued (Hilbert projection theorem requires convexity).
      A preorder is not a metric, so minimal change defined by an ordering needs no convexity, no
      distance, and no projection — the three things that broke the original formulation. The
      convexity problem was an artifact of choosing metric projection, never a fact about semantics.
      HONEST STATUS: this makes the problem tractable, not solved. "Find a projection onto a
      non-convex set" (ill-posed) becomes "specify an entrenchment ordering" (a design problem with
      a theorem guaranteeing any admissible choice yields a rational operator). Also supplies the
      mechanism CURE-CONSISTENCY-VS-OPENENDEDNESS needs: epistemic entrenchment is exactly how one
      decides what must hold versus what may change. Generalized beyond propositional logic to base
      revision in arbitrary monotonic logics.

  - id: ORDER-PARAMETER-FROM-SYMMETRY-BREAKING
    statement: >
      The semantic order parameter is derivable from the symmetry-breaking structure G/H rather than
      discoverable by benchmarking candidate metrics.
    tier: CONJECTURED
    falsified_by: >
      Identify the symmetry group G of the disordered phase and residual symmetry H of the ordered
      phase, construct the order parameter on G/H, and find it fails to exhibit the critical
      behaviour that TopSim or context independence do exhibit empirically. Also falsified if no
      well-defined G and H can be identified for semantic systems.
    evidence: research/engineering/obstructions.md
    notes: >
      Landau theory: the existence of an order parameter is directly associated with spontaneous
      symmetry breaking, and because the free energy must respect the system's symmetries, its
      expansion in powers of the order parameter "can be constructed systematically." So the order
      parameter is determined by WHICH SYMMETRY IS BROKEN, and lives in the coset space G/H. This
      replaces the previously-planned empirical search over TopSim / context independence /
      positional disentanglement with a group-theory computation. The research move is "identify G
      and H," not "benchmark three metrics."
      IMPORTANT LIMIT — DO NOT CLAIM NOETHER. Noether's theorem requires a Lagrangian/action
      formulation with continuous symmetries. Semantics has no action principle, so that route is
      unavailable until one is constructed. Landau theory is phenomenological and carries no such
      requirement, which is why it applies and Noether does not. Claiming Noether here would be
      precisely the borrowed-authority move this project has been caught making before.

  # ─── The external anchor (added 2026-08) ───────────────────────────────────

  - id: GEOMETRIC-ANCHOR-ESCAPES-LOB
    statement: >
      Grounding the semantic layer in fixed mathematical structure converts self-verification into
      reference-comparison, which the Lobian obstacle does not bite; the escape covers the semantic
      comparison function only, not the whole system.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    priority: 0
    notes: >
      Lob applies to PROOF-BASED SELF-TRUST — a system reasoning about its own provability. "Is my
      representation self-consistent?" is self-referential and Lob bites. "Does my representation
      match the fixed external structure?" is a structural comparison against something that does
      not change, is not a proof about proofs, and Lob never fires. Established pattern in three
      fields: Gentzen proved PA's consistency in PRA + transfinite induction to epsilon_0; type
      checkers have soundness proved externally as metatheory; hardware roots of trust terminate the
      regress in something the system cannot verify.
      IMPORTANT REFINEMENT: the external base need not be STRONGER. PRA is weaker than PA in most
      respects and stronger only in the one respect needed. The anchor must be more TRUSTWORTHY, not
      more POWERFUL — a much easier requirement, and the one a mathematical anchor actually meets.
      SCOPE LIMITS, do not drop these: the implementation performing the comparison remains
      untrusted (TCB shrinks, never vanishes — cf. "for type soundness theorems, only the type
      system itself is not trusted, while runtime semantics are typically taken for granted"); Lob
      still applies to the Cure reasoning about its own repair POLICY; and the mapping from
      representation to mathematical structure must still be specified and checkable — the grounding
      problem is relocated into a concrete engineering task, not dissolved.

  - id: DRIFT-MUST-BE-ABSOLUTE-NOT-RELATIVE
    statement: >
      Semantic drift measured against a maintained baseline is undetectable under common-mode drift;
      the Cure must measure against fixed invariants instead.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    priority: 0
    notes: >
      Not an analogy — the identical engineering problem, already solved in metrology. The kilogram
      was defined by the IPK, a platinum-iridium artifact subject to mass drift from surface
      contamination and atomic-level material loss, which lost roughly 50 micrograms against its
      official value over a century. THE STANDARD ITSELF DRIFTED, so drift was unmeasurable in
      absolute terms — comparison was only ever against copies that were also drifting. The 2019 SI
      redefinition replaced the artifact with the Planck constant (h fixed at 6.62607015e-34 J s),
      giving an unchanging basis consistent across time and space, independent of any physical change
      in a prototype. The Cure as currently specified is the IPK design. It should be the post-2019
      design. Structural note: h was a MEASURED quantity whose value was then FIXED BY DEFINITION — a
      conventional act at the base that renders everything downstream non-conventional, the same
      shape as this repo's DESIGN-CHOICE vs discovery distinction.

  - id: ANCHOR-IS-DISTINCTION-AND-INCIDENCE
    statement: >
      The trust anchor is Point and Enclosure — distinction and incidence — not the geometric
      inventory generally, because those are the provably most invariant structures available.
    tier: ARGUED
    evidence: research/framework/external-anchor.md
    notes: >
      Metrology's principle is to anchor to the most invariant thing available. ERLANGEN-SURVIVAL-
      RANKING already computed that ranking: Point and Enclosure survive to the topological level
      while the entire curvature family is eliminated by projective. So the anchor is DERIVED rather
      than chosen. Connects to ENCLOSURE-IS-DISTINCTION: the surviving primitive is the Layer 0 mark
      via Jordan separation.
      ANCHOR TO THE MATHEMATICS, NOT TO "THE UNIVERSE." Physical space is not Euclidean; it is curved
      and locally variable, so a physical-geometry anchor reinherits the IPK pathology in new
      costume. The classification theorems hold regardless of physical geometry because they concern
      mathematical structures rather than measurements of space. The mathematical anchor is strictly
      more invariant than a physical one.
      CONSEQUENCE FOR THE GEOMETRIC PROGRAM: demoted to "symmetry clue" under the emergent-
      universality reframe, it returns here as the TRUST ANCHOR — a load-bearing engineering role,
      and a different one from its retired role as foundation.

  # ─── Research methodology under an untrusted literature (added 2026-08) ─────

  - id: EVIDENCE-VERIFIABILITY-RANKING
    statement: >
      Evidence is ranked by how much trust it requires, not by citation weight; no foundational
      claim may rest on a single citation read via summary.
    tier: DESIGN-CHOICE
    rationale: research/method/source-independence.md
    alternatives_considered:
      - "rank by citation count / journal prestige (rejected: exactly the axis a corrupted or biased literature controls)"
      - "accept literature consensus as baseline (rejected: consensus can drift or be pushed — the IPK pathology applied to research)"
    notes: >
      Tiers: (1) proof we can check ourselves — source-independent by construction; (2) primary
      source read directly; (3) convergence across mutually hostile or non-contacting traditions —
      no single actor seeds all of them; (4) reproduction we ran ourselves; (5) single citation via
      summary, which may NOT be load-bearing. Orthogonal to the existing claims.yaml tiers: those
      rank how well established a claim is, this ranks how much trust its evidence requires.
      STRUCTURAL NOTE: this is the same move as DRIFT-MUST-BE-ABSOLUTE-NOT-RELATIVE, applied to
      research rather than to representations. Anchor to what you can verify yourself. A theorem
      does not care who funded it — Gentzen's proof can be checked line by line without trusting
      Gentzen, the journal, or the century. Mathematics is the only evidence whose source is
      irrelevant because verification is available to anyone who does the work.
      COST, honestly: tier-1/2 evidence is slow. Apply to load-bearing claims only or it consumes
      the project. And the research TCB never reaches zero — the goal is small, explicit, and
      mathematical.

  - id: LOOP-ATTRIBUTION-IS-INTERNAL-SO-FAR
    statement: >
      The recurring "found proof it's impossible" loop is attributable to internal asymmetric
      scrutiny rather than to literature corruption, on all seven documented instances.
    tier: ARGUED
    evidence: research/method/source-independence.md
    notes: >
      DISCRIMINATOR: if the literature were seeded, counter-evidence should be systematically hard
      to find — obscure, low-quality, poorly indexed, or absent. If the loop is internal bias,
      counter-evidence sits in plain sight and simply was not sought. On all seven instances
      (F-017) counter-evidence was trivially findable with a single search: Christiansen & Chater is
      in Behavioral and Brain Sciences and heavily cited; AGM/Katsuno-Mendelzon is textbook
      belief revision; Landau theory is undergraduate physics.
      SCOPE — R2 applies to this claim as much as to any other: this bears on SEVEN DATA POINTS. It
      does not test whether any literature is corrupted elsewhere or at levels these questions do
      not reach. Do not cite it as a general refutation of the corruption hypothesis.
      Instrumented going forward by the S7 logging rule, so attribution accumulates evidence rather
      than remaining a standoff.

  - id: CORRUPTION-HYPOTHESIS-MUST-STAY-FALSIFIABLE
    statement: >
      Per-negative logging of whether counter-evidence was easy or hard to find is required for the
      corruption hypothesis to function as a hypothesis rather than as an unfalsifiable frame.
    tier: DESIGN-CHOICE
    rationale: research/method/source-independence.md
    alternatives_considered:
      - "treat absence of supporting research as evidence of suppression (rejected: unfalsifiable, and absences are overwhelmingly explained by nobody having cared)"
      - "ignore the possibility entirely (rejected: literature corruption is documented at smaller scales — industry-funded research, trial suppression, publication bias, the replication crisis)"
    notes: >
      A corruption hypothesis that explains away every disconfirming finding as planted is
      unfalsifiable BY CONSTRUCTION — structurally identical to the D2 failure this project already
      documented, where theory was patched after each disconfirmation until it scored 100%. The
      same discipline that protects against internal bias protects against this. Making it
      measurable keeps it a hypothesis.
      Corresponding discipline on conspicuous absences (S5): an unrun experiment is a WORK ITEM,
      never evidence. Log it, then run it — which converts speculation into tier-4 evidence
      regardless of why the gap existed.

  # ─── Zadrozny scope correction (added 2026-08, note 011) ───────────────────

  - id: ZADROZNY-SCOPE
    statement: >
      Zadrozny's vacuity result applies to UNCONSTRAINED compositionality only; it does not show
      compositionality vacuous once background constraints on syntax and lexical semantics are
      imposed, and the constraints that close his escape hatch are ones this project already
      requires.
    tier: ARGUED
    evidence: research/notes/011-zadrozny-scope/README.md
    priority: 0
    scope: >
      MANDATORY BEFORE CITING (R2). Zadrozny (1994) is mathematically sound but achieves
      compositionality by re-encoding meanings in a way that DOES NOT PRESERVE SYNONYMY RELATIONS.
      Critical literature: Kazmi & Pelletier (1998) "Is Compositionality Formally Vacuous?"
      (Linguistics and Philosophy 21:629-633); Westerstahl (1998) "On mathematical proofs of the
      vacuity of compositionality"; Dever (1999); and Janssen (1983) for the equivalent earlier
      result. Their position: "the task of semantics is to identify a meaning assignment that
      respects both what our best syntax tells us about structure and what our best intuitions tell
      us about synonymy - these results do not show compositionality to be empirically empty," and
      "for compositionality to be a substantive constraint it must be paired with background
      constraints on syntax and the semantics of the basic lexical items."
      DO NOT cite Zadrozny as closing the necessity route. It closes the UNCONSTRAINED route only.
      This project supplies both missing constraints: a synonymy relation (SEMANTIC-EQUALITY, wanted
      regardless) and a fixed syntactic structure (the geometric composition rules).
    notes: >
      Consequence: the logical-necessity route is OPEN AND HARD, not dead. It had been recorded as
      dead since note 003 on an over-broad reading of a correctly-proved theorem. This does NOT
      resurrect the retired Unique Grounding Theorem, which failed for circularity — a separate and
      still-fatal defect.
      Found only because the claim was challenged directly. R1 mandates adversarial search on every
      negative, but was written after Zadrozny was already load-bearing, and nothing required
      auditing negatives that predated the rule. See FAILURES.md F-019.

  - id: FIXED-POINT-TABLE-IS-CANONICAL
    statement: >
      Inventories are presentation-dependent below the coarse-graining fixed point, but the
      structure surviving at the fixed point is canonical — derived rather than chosen — so a fixed
      universal symbol table is the table at the fixed point.
    tier: ARGUED
    evidence: research/notes/011-zadrozny-scope/README.md
    priority: 0
    notes: >
      CORRECTS an over-general statement. "There is no fixed universal symbol table" and
      ERLANGEN-SURVIVAL-RANKING ("Point and Enclosure survive to the topological level") cannot both
      be stated unqualified — the first was applied at a level where it does not hold.
      Below the fixed point: many presentations, cardinality varies, no privileged choice
      (PRIMITIVE-SETS-ARE-GENERATING-SETS still holds there).
      At the fixed point: distinction (Jordan separation) and incidence. Small, derived, canonical.
      METHODOLOGICAL CONVERGENCE worth acting on: the symmetry-grid approach to symbol tables and
      the Landau G/H derivation of the order parameter are the same move from two directions. If a
      symmetry group generates the table, the group determines its contents. "Which symbol table"
      and "what are G and H" (ORDER-PARAMETER-FROM-SYMMETRY-BREAKING) are one question, not two.

  # ─── Roster A falsification results (added 2026-08, note 012) ──────────────

  - id: NEWMAN-OBJECTION
    statement: >
      Structural claims are vulnerable to Newman's objection — any domain of sufficient cardinality
      admits a suitable structure — and the framework's answer must be that its privileged relations
      are DERIVED by transformation group rather than stipulated.
    tier: CONJECTURED
    falsified_by: >
      Show that the Erlangen group tower is itself an arbitrary choice with no principled
      justification, in which case the group-theoretic privileging reduces to stipulation and the
      framework inherits Newman's triviality in full.
    evidence: research/notes/012-roster-a-falsification/README.md
    priority: 0
    scope: >
      Newman's objection bites PURELY ABSTRACT structural claims — where the only content is that
      some relation with given formal properties exists. Standard responses privilege "natural" or
      "founded" relations (Melia & Saatsi 2006; Carnap's founded relations), which STIPULATE the
      privileging. Do not cite the objection as defeating structural claims generally.
    notes: >
      SAME SHAPE AS ZADROZNY: "you can always construct it that way, therefore the claim is empty."
      Two of the three deepest objections this project faces are that identical move, which is worth
      noticing as a pattern — such arguments are defeated by supplying the constraint the
      construction quietly drops, not by abandoning the claim.
      OUR POSITION IS STRONGER THAN THE STANDARD RESPONSE: Erlangen privileges relations by
      transformation group, and ERLANGEN-SURVIVAL-RANKING is a computation rather than an appeal to
      experience. It is not free, however.
      THE OPEN OBLIGATION, and currently the sharpest philosophical one on the framework: say why
      the group tower is not itself arbitrary.

  - id: TOPSIM-INSUFFICIENT
    statement: >
      Topographic similarity does not establish compositional structure and cannot serve as the
      semantic order parameter.
    tier: ARGUED
    evidence: research/notes/012-roster-a-falsification/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). These criticisms target TopSim AS A MEASURE. They do NOT show
      that agent protocols fail to converge, nor that compositionality is absent — only that this
      metric cannot establish it. Do not cite as "emergent communication shows no structure."
    formalization: "TopSim as the operationalization of compositionality — not the convergence claim itself (R3)"
    revival_condition: >
      A measure that distinguishes derivational structure rather than string edit distance.
      Concept-Best-Matching (arXiv 2403.14705) is a live candidate. Zero-shot cross-play
      compatibility is preferable still, being behavioural and metric-independent.
    refutation_tier: "ARGUED — multiple independent papers, consistent finding"
    notes: >
      Steelman before the kill (R6): TopSim would be adequate if message-space edit distance
      reliably tracked semantic composition. It does not — different derivations can yield identical
      edit-distance profiles, so fixed-order concatenation and free-ordered insertion/deletion score
      the same.

  # ─── Roster G: emergent communication (added 2026-08, note 013) ────────────

  - id: SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY
    statement: >
      Arbitrary symbolic protocols developed by independently trained agent populations are mutually
      unintelligible, because token permutation invariance leaves many equally valid equilibria.
    tier: ARGUED
    evidence: research/notes/013-roster-g-emergent-communication/README.md
    scope: >
      MANDATORY BEFORE CITING (R2). Applies to ARBITRARY SYMBOLIC channels only. Does NOT apply to
      iconic or perceptually anchored channels — see ICONIC-GROUNDING-ENABLES-CROSSPLAY, which is
      the direct counter-case. Do not cite as "emergent protocols never converge" or as evidence
      against emergent universality: class membership does not entail mutual intelligibility (water
      and magnets share critical exponents; you cannot pour a magnet). It IS evidence against any
      reading of UL as a shared code independent systems would simply arrive at.
    notes: >
      "Symbolic channels admit near-permutation invariance over tokens, meaning many equally valid
      equilibria can emerge that are mutually unintelligible across independently trained
      populations." Protocols "devolve into idioglossia — co-adapted protocols that are
      unintelligible to outsiders."
      THE MECHANISM IS THE USEFUL PART: nothing in an arbitrary channel fixes which token means
      what, so every permutation is an equally good equilibrium. That is a precise account of why
      arbitrary symbol systems cannot converge — and it identifies exactly what a notation must
      supply to escape.

  - id: ICONIC-GROUNDING-ENABLES-CROSSPLAY
    statement: >
      Iconic, spatially structured, perceptually anchored notation achieves zero-shot mutual
      intelligibility between independently trained populations where symbolic protocols fail.
    tier: CONJECTURED
    falsified_by: >
      Primary reading shows the effect is carried by population scaling alone rather than by
      iconicity, or fails to replicate, or the "disjoint populations" are less independent than the
      summary implies.
    evidence: research/notes/013-roster-g-emergent-communication/README.md
    priority: 0
    notes: >
      "Sketches communicate iconically through visual resemblance and spatial structure, thereby
      anchoring meaning in perceptual reality, enabling independently trained agents sampled from
      disjoint populations to achieve high mutual intelligibility." (arXiv 2606.10582, "Drawing with
      Strangers".)
      This describes UWS's design — iconic mark-features plus spatial placement grammar — and it
      dissolves the permutation-invariance problem in SYMBOLIC-PROTOCOLS-FAIL-CROSSPLAY, since an
      iconic mark is not arbitrary with respect to its referent.
      CONVERGENCE: independently supports UWS-PERCEPTUAL-GROUNDING, which rests on Changizi's
      finding that 100+ writing systems share contour statistics matching natural-scene structure.
      Two unrelated lines land on perceptual grounding as what makes a notation work across
      independently developed systems.
      DELIBERATELY HELD AT CONJECTURED. Single paper, read via summary — evidence tier S1-5, which
      by our own rule may not be load-bearing. TOPSIM-INSUFFICIENT was downgraded one note earlier on
      multiple independent criticisms; banking this at ARGUED would be precisely the asymmetric
      scrutiny F-017 documents. Also note the finding is population scaling PLUS iconicity, not
      iconicity alone. Read the primary source at tier S1-2 before it carries weight.

  - id: COMPOSITIONALITY-REQUIRES-PRESSURE
    statement: >
      Compositionality does not emerge by default; it requires both compression pressure (a
      transmission bottleneck) and communication pressure (expressivity).
    tier: ARGUED
    evidence: research/notes/013-roster-g-emergent-communication/README.md
    notes: >
      Kirby et al. (2015): compression alone produces degenerate results; both pressures are
      necessary. "Non-compositional languages will not persist over time when the bottleneck on
      cultural transmission is tight."
      KILLS any naive "compositionality is inevitable" reading.
