  - id: UWS-AS-INSTRUMENT
    statement: "Expressive failures of the notation are empirical data about the structure of meaning."
    tier: DESIGN-CHOICE
    rationale: research/framework/uws-as-instrument.md
    alternatives_considered: ["UWS as pure output/rendering of UL (rejected — loses the discovery mechanism)"]
    notes: >
      Only valid under a hard rule: failures are logged in FAILURES.md and never patched into
